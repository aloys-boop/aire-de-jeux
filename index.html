<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E5E8EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111316" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Aire de jeux">
<meta name="description" content="Jeux de route entre potes : On s’en souviendra ?, Tu préfères, Devine le prix et d’autres.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Aire de jeux</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Overpass:wght@400;600;700;800&family=Overpass+Mono:wght@600;700&display=swap">
<style>
/* Concept : une aire d’autoroute. Chaque jeu est un panneau de signalisation français
   (bleu autoroute, marron patrimoine, vert direction, blanc local, jaune déviation),
   les joueurs sont des bornes kilométriques, le marquage jaune sert d’accent. */
:root{
  --bg:#E5E8EC; --surface:#FFFFFF; --surface-2:#F0F2F5; --ink:#13171C; --muted:#55606B; --line:#D2D8DF;
  --sign-blue:#1A4E9B; --sign-brown:#7B4628; --sign-green:#0F7148; --sign-paper:#F8F8F4; --sign-ink:#111111; --sign-red:#C8102E;
  --yellow:#F6B800; --on-yellow:#17130A; --good:#1C8A4B; --near:#B87D00; --asphalt:#2A2F35; --borne:#F4F4F0;
  --shadow:0 1px 0 rgb(0 0 0 / .16), 0 12px 26px -16px rgb(10 25 50 / .5);
  --f-display:"Barlow Condensed","Arial Narrow","Roboto Condensed",sans-serif;
  --f-body:"Overpass","Helvetica Neue",Arial,sans-serif;
  --f-num:"Overpass Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111316; --surface:#1B1E22; --surface-2:#23272C; --ink:#ECEEF1; --muted:#9AA3AD; --line:#2E3339;
    --good:#3DBA72; --near:#E3A920; --asphalt:#0A0B0D; --borne:#ECECE6;
    --shadow:0 1px 0 rgb(0 0 0 / .5), 0 14px 30px -16px rgb(0 0 0 / .9); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111316; --surface:#1B1E22; --surface-2:#23272C; --ink:#ECEEF1; --muted:#9AA3AD; --line:#2E3339;
  --good:#3DBA72; --near:#E3A920; --asphalt:#0A0B0D; --borne:#ECECE6;
  --shadow:0 1px 0 rgb(0 0 0 / .5), 0 14px 30px -16px rgb(0 0 0 / .9); color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg); color:var(--ink); font-family:var(--f-body); font-size:16px; line-height:1.5;
  padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color:transparent;
}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top, 0px); z-index:10; background:var(--bg)}
button{font:inherit; color:inherit; cursor:pointer}
button:focus-visible, input:focus-visible, summary:focus-visible{outline:3px solid var(--yellow); outline-offset:2px}
.wrap{max-width:560px; margin:0 auto; padding-block:16px 56px; display:flex; flex-direction:column; gap:24px}
h1,h2,h3{text-wrap:balance; margin:0}
p{margin:0}

/* Panneaux */
.sign{--c:var(--sign-blue); --fg:#fff; --bd:#fff; --bw:2.5px;
  display:block; width:100%; background:var(--c); color:var(--fg); border:0; border-radius:16px; padding:5px;
  box-shadow:var(--shadow); text-align:left}
.sign > .in{position:relative; display:flex; flex-direction:column; gap:8px; height:100%;
  border:var(--bw) solid var(--bd); border-radius:11px; padding:16px 16px 18px}
.sign.brown{--c:var(--sign-brown)}
.sign.green{--c:var(--sign-green)}
.sign.paper{--c:var(--sign-paper); --fg:var(--sign-ink); --bd:var(--sign-ink)}
.sign.red{--c:var(--sign-paper); --fg:var(--sign-ink); --bd:var(--sign-red); --bw:6px}
.sign.red > .in{padding:14px 14px 16px}
.sign.yellow{--c:var(--yellow); --fg:var(--on-yellow); --bd:var(--on-yellow)}
.picto{width:34px; height:34px; display:block}
.picto svg{width:100%; height:100%; display:block}

/* En-tête */
.hero .in{gap:12px; padding:18px 18px 16px}
.hero-row{display:flex; align-items:flex-start; justify-content:space-between; gap:12px}
.hero h1{font-family:var(--f-display); line-height:.9; display:flex; flex-direction:column}
.hero h1 span{font-weight:600; font-size:24px; letter-spacing:.01em}
.hero h1 b{font-weight:800; font-size:clamp(58px,17vw,76px); letter-spacing:-.01em}
.dist{font:700 30px/1 var(--f-display); white-space:nowrap; padding-top:4px}
.hero-sub{font-size:15px; line-height:1.45; max-width:40ch; opacity:.92}
.services{display:flex; gap:6px; flex-wrap:wrap}
.svc{width:34px; height:34px; border-radius:6px; background:#fff; color:var(--sign-blue); display:grid; place-items:center}
.svc svg{width:22px; height:22px}

/* Sections */
.sec{display:flex; flex-direction:column; gap:12px}
.sec-head{display:flex; align-items:baseline; justify-content:space-between; gap:12px}
.sec-head h2{font:800 26px/1 var(--f-display); letter-spacing:.01em}
.link{background:none; border:0; padding:6px 0; font-weight:700; font-size:15px; color:var(--muted); text-decoration:underline; text-underline-offset:3px}

/* Bornes kilométriques = joueurs */
.bornes{display:flex; gap:12px; overflow-x:auto; padding:2px 2px 8px}
.borne{flex:0 0 auto; width:62px; display:flex; flex-direction:column; align-items:center}
.borne .b{width:58px; height:84px; border-radius:29px 29px 5px 5px; background:var(--borne); overflow:hidden;
  display:flex; flex-direction:column; align-items:center; box-shadow:inset 0 -7px 0 rgb(0 0 0 / .08), var(--shadow)}
.borne .cap{width:100%; height:36px; background:var(--cap); color:var(--capfg); padding:9px 4px 0;
  font:700 13px/1.2 var(--f-display); text-transform:uppercase; letter-spacing:.04em; text-align:center;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.borne .num{font:700 24px/1 var(--f-num); color:#111; margin-top:12px; font-variant-numeric:tabular-nums}
.leader{font-size:14px; color:var(--muted)}
.leader b{color:var(--ink)}

/* Édition de l’équipage */
.editor{display:flex; flex-direction:column; gap:8px; background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:12px}
.ed-row{display:grid; grid-template-columns:12px minmax(0,1fr) auto; align-items:center; gap:10px}
.ed-row i{width:12px; height:12px; border-radius:3px; background:var(--cap)}
.ed-row input{width:100%; min-height:44px; border:1.5px solid var(--line); border-radius:10px; background:var(--surface-2); color:var(--ink); padding:0 12px; font:600 16px var(--f-body)}
.ed-del{min-width:44px; min-height:44px; border-radius:10px; border:1.5px solid var(--line); background:transparent; font-weight:800; color:var(--muted)}
.ed-actions{display:flex; gap:8px; flex-wrap:wrap}
.btn-s{min-height:44px; padding:0 14px; border-radius:10px; border:1.5px solid var(--line); background:var(--surface-2); font-weight:700; font-size:15px}
.btn-s.solid{background:var(--ink); color:var(--bg); border-color:var(--ink)}
.btn-s.warn{border-color:var(--sign-red); color:var(--sign-red); background:transparent}

/* Portique des jeux */
.gantry{display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:12px}
.game-sign{cursor:pointer; transition:transform .12s ease}
.game-sign:active{transform:translateY(2px) scale(.99)}
.game-sign .in{min-height:168px; gap:6px}
.gname{font:700 25px/1.02 var(--f-display); margin-top:6px}
.gpitch{font-size:13px; line-height:1.35; opacity:.88}
.mine{position:absolute; top:10px; right:10px; font:700 10px/1 var(--f-body); letter-spacing:.08em; text-transform:uppercase;
  background:var(--fg); color:var(--c); padding:5px 6px 4px; border-radius:4px}
.sign.red .mine{background:var(--sign-red); color:#fff}
.cnt{margin-top:auto; font:600 12px var(--f-num); opacity:.75}

.howto{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:16px; display:flex; flex-direction:column; gap:8px}
.howto h3{font:800 20px/1.1 var(--f-display)}
.howto ol{margin:0; padding-left:20px; display:flex; flex-direction:column; gap:4px; font-size:15px}
.foot{font-size:13px; color:var(--muted); line-height:1.5}

/* Écran de jeu */
.topbar{position:sticky; top:env(safe-area-inset-top, 0px); z-index:20; background:var(--bg); border-bottom:1px solid var(--line);
  margin-left:calc(-1 * max(16px, env(safe-area-inset-left, 0px))); margin-right:calc(-1 * max(16px, env(safe-area-inset-right, 0px)));
  padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px))}
.topbar-in{max-width:560px; margin:0 auto; display:grid; grid-template-columns:auto minmax(0,1fr) auto; align-items:center; gap:10px; min-height:56px}
.back{min-height:44px; padding:0 12px 0 8px; border-radius:10px; border:1.5px solid var(--line); background:var(--surface); font-weight:800; font-size:15px; display:flex; align-items:center; gap:4px}
.back svg{width:18px; height:18px}
.tb-title{font:800 20px/1 var(--f-display); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.tb-count{font:700 13px var(--f-num); color:var(--muted); font-variant-numeric:tabular-nums}
.rule{font-size:15px; color:var(--muted)}
.rule summary{cursor:pointer; font-weight:700; color:var(--ink); list-style:none; display:flex; align-items:center; gap:6px; min-height:32px}
.rule summary::-webkit-details-marker{display:none}
.rule summary::before{content:"+"; display:inline-grid; place-items:center; width:20px; height:20px; border-radius:5px; background:var(--surface-2); border:1px solid var(--line); font-weight:800}
.rule[open] summary::before{content:"−"}
.rule p{padding-top:6px; max-width:62ch}

.eyebrow{font:700 12px/1.3 var(--f-body); letter-spacing:.12em; text-transform:uppercase}
.sign .eyebrow{opacity:.85}
.big{font:800 clamp(36px,11vw,50px)/.98 var(--f-display); letter-spacing:-.005em}
.sub{font-size:16px; opacity:.9}
.q{font:700 clamp(25px,7vw,32px)/1.1 var(--f-display)}
.opt{display:flex; gap:12px; align-items:flex-start; font:700 clamp(23px,6.4vw,29px)/1.1 var(--f-display); transition:opacity .2s}
.opt .tag{flex:none; width:32px; height:32px; border-radius:7px; background:var(--fg); color:var(--c); font:800 20px/33px var(--f-display); text-align:center}
.sign.paper .opt .tag, .sign.red .opt .tag{color:var(--sign-paper)}
.or{font:700 12px/1 var(--f-body); letter-spacing:.16em; text-transform:uppercase; opacity:.75; padding:4px 0 4px 44px}
.revealed .opt:not(.chosen){opacity:.45}
.opt.chosen .tag{background:var(--yellow); color:var(--on-yellow)}
.sign.yellow .opt.chosen .tag{background:var(--on-yellow); color:var(--yellow)}

.picks{display:flex; flex-direction:column; gap:8px}
.picks-h{font:800 20px/1.1 var(--f-display)}
.hint{font-size:15px; color:var(--muted)}
.pick{display:grid; grid-template-columns:minmax(0,1fr) auto; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:8px 8px 8px 12px}
.pick.wide{grid-template-columns:minmax(0,1fr); padding:10px}
.pname{display:flex; align-items:center; gap:8px; font-weight:700; min-width:0}
.pname i{flex:none; width:10px; height:10px; border-radius:3px; background:var(--cap)}
.pname span{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.pname .sc{margin-left:auto; font:700 13px var(--f-num); color:var(--muted); font-variant-numeric:tabular-nums}
.award{font:700 13px var(--f-num); color:var(--good); white-space:nowrap}
.chips{display:grid; grid-template-columns:repeat(var(--n), minmax(0,1fr)); gap:6px}
.pick:not(.wide) .chips{grid-template-columns:repeat(var(--n), minmax(62px,auto))}
.chip{min-height:46px; border-radius:10px; border:1.5px solid var(--line); background:var(--surface-2); color:var(--ink);
  font:700 15px var(--f-body); padding:0 10px; font-variant-numeric:tabular-nums; transition:background .12s, color .12s}
.chip[aria-pressed="true"]{background:var(--ink); color:var(--bg); border-color:var(--ink)}
.chip:disabled{cursor:default}
.chip.good{box-shadow:0 0 0 3px var(--good)}
.chip.near{box-shadow:0 0 0 3px var(--near)}
.winners{display:flex; flex-wrap:wrap; gap:8px}
.winners .chip{display:flex; align-items:center; gap:8px; padding:0 14px}
.winners .chip i{width:10px; height:10px; border-radius:3px; background:var(--cap)}

.btn{display:block; width:100%; min-height:58px; border-radius:14px; border:0; font:800 18px var(--f-body); letter-spacing:.01em}
.btn.primary{background:var(--yellow); color:var(--on-yellow); box-shadow:inset 0 -4px 0 rgb(0 0 0 / .18)}
.btn.primary:active{transform:translateY(1px)}
.btn.ghost{background:transparent; color:var(--muted); border:1.5px dashed var(--line); min-height:48px; font-size:15px; font-weight:700}
.nav{display:flex; flex-direction:column; gap:10px}

.reveal{scroll-margin-top:72px; background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:18px; display:flex; flex-direction:column; gap:14px; animation:pop .32s ease-out}
.reveal .eyebrow{color:var(--muted)}
.verdict{font:800 clamp(38px,11vw,48px)/1 var(--f-display)}
.why{font-size:16.5px; line-height:1.58; max-width:62ch}
.pts-line{font-size:15px; font-weight:700; color:var(--good)}
.pts-line.none{color:var(--muted); font-weight:600}
@keyframes pop{from{transform:translateY(8px); opacity:.4} to{transform:none; opacity:1}}

.road{display:flex; flex-direction:column; gap:8px}
.asphalt{position:relative; height:44px; border-radius:8px; background:var(--asphalt)}
.asphalt .fill{position:absolute; inset:0 auto 0 0; border-radius:8px; background:linear-gradient(90deg, rgb(246 184 0 / 0), rgb(246 184 0 / .38))}
.asphalt .dash{position:absolute; left:10px; right:10px; top:50%; height:3px; margin-top:-1.5px; background:repeating-linear-gradient(90deg,#F4F4F0 0 14px, transparent 14px 26px)}
.asphalt .car{position:absolute; top:50%; width:38px; height:24px; transform:translate(-50%,-50%); color:var(--yellow)}
.asphalt .car svg{width:100%; height:100%; display:block}
.marks{display:grid; grid-template-columns:repeat(5, minmax(0,1fr)); text-align:center; font:600 12px var(--f-num); color:var(--muted)}
.marks span.on{color:var(--ink); font-weight:700}
.marks small{display:block; font-size:10px; opacity:.8}

.gauge{position:relative; height:20px; border-radius:10px; background:var(--surface-2); border:1px solid var(--line); overflow:hidden}
.gauge span{position:absolute; inset:0 auto 0 0; background:var(--sign-red)}
.gauge-ticks{display:flex; justify-content:space-between; font:600 11px var(--f-num); color:var(--muted)}

.tl{display:flex; flex-direction:column; gap:0; border-left:3px solid var(--line); margin-left:6px}
.tl div{position:relative; padding:4px 0 12px 16px}
.tl div::before{content:""; position:absolute; left:-8.5px; top:9px; width:14px; height:14px; border-radius:50%; background:var(--surface); border:3px solid var(--ink)}
.tl div.a::before{background:var(--yellow); border-color:var(--yellow)}
.tl b{display:block; font-size:16px; line-height:1.3}
.tl span{font:600 13px var(--f-num); color:var(--muted)}

.ranks{display:flex; flex-direction:column; gap:8px}
.rank{display:grid; grid-template-columns:auto minmax(0,1fr); gap:12px; align-items:center; padding:10px 12px; border-radius:12px; background:var(--surface-2)}
.rank b{font:800 22px/1 var(--f-display)}
.rank em{font-style:normal; font:700 13px var(--f-num); display:inline-grid; place-items:center; min-width:46px; height:30px; border-radius:7px; background:var(--line); color:var(--ink); padding:0 6px}
.rank.win em{background:var(--yellow); color:var(--on-yellow)}

.toast{position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom, 0px)); transform:translateX(-50%); z-index:50;
  background:var(--ink); color:var(--bg); padding:12px 16px; border-radius:12px; font-weight:700; font-size:14px; max-width:calc(100% - 32px); box-shadow:var(--shadow)}

@media (max-width:360px){ .gantry{grid-template-columns:minmax(0,1fr)} .game-sign .in{min-height:0} }
@media (prefers-reduced-motion: reduce){ *{animation:none!important; transition:none!important} }
</style>
</head>
<body>

<div id="app"></div>
<div id="toast" class="toast" hidden></div>

<script>
/* ============ CONTENU ============ */

/* On s’en souviendra ? v : 0 = moins de 100 ans, 1 = 100 ans, 2 = 300 ans, 3 = 500 ans, 4 = 1 000 ans et plus */
const SOUV = [
 {n:"Adolf Hitler", d:"Dictateur nazi (1889-1945)", v:4, w:"La Seconde Guerre mondiale et la Shoah sont les événements les plus documentés de l’histoire humaine. Son nom sert déjà de mot pour dire « le mal absolu ». Néron et Attila sont toujours cités 1 500 à 2 000 ans après leur mort : il les rejoindra."},
 {n:"Cristiano Ronaldo", d:"Footballeur portugais, 5 Ballons d’or", v:1, w:"Dans 100 ans, les fans de foot le connaîtront encore, comme on connaît Pelé aujourd’hui. Au-delà, les sportifs ne traversent pas les époques : les sports changent et les records tombent. Qui connaît le meilleur jouteur de l’an 1400 ? Personne."},
 {n:"Napoléon Bonaparte", d:"Empereur des Français (1769-1821)", v:4, w:"Déjà 200 ans et toujours le Français le plus étudié au monde. Son Code civil inspire encore le droit de dizaines de pays. C’est le Jules César de l’époque moderne, et César tient depuis 2 000 ans."},
 {n:"Albert Einstein", d:"Physicien, théorie de la relativité", v:4, w:"Son nom est devenu un nom commun pour dire « génie », et E = mc² est l’équation la plus célèbre du monde. Archimède est encore connu 2 200 ans après lui pour bien moins que ça."},
 {n:"Elon Musk", d:"Patron de Tesla et de SpaceX", v:2, w:"Tout dépend de Mars. Si SpaceX y pose les premiers humains, il devient le Christophe Colomb du XXIe siècle et passe à 1 000 ans. Sinon, il finit comme Rockefeller : un nom qui veut dire « très riche », sans plus. Je mise sur 300 ans."},
 {n:"Kylian Mbappé", d:"Footballeur, champion du monde 2018", v:0, w:"Qui connaît Raymond Kopa, Ballon d’or 1958 ? Presque plus personne, moins de 70 ans après. Sauf s’il gagne trois Coupes du monde, Mbappé prendra le même chemin."},
 {n:"Lionel Messi", d:"Footballeur argentin, 8 Ballons d’or", v:1, w:"Même verdict que Ronaldo : une légende pour les fans pendant un siècle, puis une ligne dans les livres de sport. Le duel Messi-Ronaldo survivra peut-être mieux que chacun des deux séparément."},
 {n:"Steve Jobs", d:"Cofondateur d’Apple, père de l’iPhone", v:1, w:"Qui connaît George Eastman, le fondateur de Kodak ? Kodak a pourtant été aussi incontournable qu’Apple. Les entrepreneurs survivent quand leur nom est sur le produit, comme Ford ou Disney. Le sien n’y est pas."},
 {n:"Marie Curie", d:"Physicienne, deux prix Nobel", v:4, w:"Son nom est gravé dans le tableau périodique (le curium) et dans une unité de mesure (le curie). Les noms d’unités ne meurent jamais : demande à Volta, Ampère ou Newton."},
 {n:"Michael Jackson", d:"Le roi de la pop", v:2, w:"Énorme différence avec les stars d’avant : sa musique est enregistrée et ne disparaîtra pas. Thriller reste l’album le plus vendu de l’histoire et le moonwalk est un pas universel. Pour 1 000 ans, il faudrait qu’on enseigne la pop comme on enseigne Mozart."},
 {n:"Les Beatles", d:"Groupe anglais des années 1960", v:3, w:"Ils sont déjà étudiés dans les conservatoires. Dans 500 ans, ils seront à la pop ce que Bach est au baroque : les fondateurs qu’on cite pour expliquer tout le reste."},
 {n:"Kim Kardashian", d:"Star de téléréalité et d’Instagram", v:0, w:"Célèbre pour être célèbre. Les « it-girls » des années 1920 étaient aussi connues qu’elle à leur époque. Tu peux en citer une ?"},
 {n:"Charles de Gaulle", d:"Général, président de 1959 à 1969", v:3, w:"L’homme du 18 Juin et le fondateur de la Ve République. En France, il a le profil de Jeanne d’Arc : le sauveur de la nation. Elle tient depuis 600 ans, il tiendra au moins 500."},
 {n:"Emmanuel Macron", d:"Président de la République depuis 2017", v:1, w:"Qui connaît Gaston Doumergue, président de 1924 à 1931 ? Après un siècle, seuls les présidents liés à une guerre ou à un changement de régime restent dans les conversations. Les autres restent dans les manuels."},
 {n:"Donald Trump", d:"45e et 47e président des États-Unis", v:2, w:"Grover Cleveland a aussi fait deux mandats non consécutifs, et presque personne ne le connaît. Mais l’époque de Trump, avec les réseaux sociaux et la polarisation, sera énormément étudiée par les historiens. Je dis 300 ans."},

 euro:'<circle cx="12" cy="12" r="9"/><path d="M15.5 8.6a4.4 4.4 0 1 0 0 6.8M7.2 10.7h6.3M7.2 13.3h6.3"/>',

};
const ic = (k, sw=2) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${PICTO[k]}</svg>`;
const CAR = '<svg viewBox="0 0 40 24" aria-hidden="true"><path fill="currentColor" d="M5 15.5v-3.2l3.4-6.2c.5-.9 1.4-1.4 2.4-1.4h17.6c1 0 1.9.5 2.4 1.4l3.4 6.2v3.2c0 1-.8 1.8-1.8 1.8H6.8c-1 0-1.8-.8-1.8-1.8Z"/><path fill="#0A0B0D" d="M10.6 7.2h18.8l2.4 4.6H8.2Z" opacity=".55"/><circle cx="11" cy="18" r="3.3" fill="#0A0B0D"/><circle cx="29" cy="18" r="3.3" fill="#0A0B0D"/></svg>';

const GAMES = [
 {id:"souvenir", name:"On s’en souviendra ?", pitch:"Dans 100, 300, 500 ou 1 000 ans ? Mon verdict à la clé.", sign:"brown", picto:"temple",
  opts:["< 100","100","300","500","1 000+"], rule:"Chacun choisit jusqu’à quand on se souviendra de cette personne. Même horizon que mon verdict : 2 points. Juste à côté : 1 point. Contester mon verdict est fortement encouragé."},
 {id:"tp", name:"Tu préfères", pitch:"Deux options, un seul choix. Et le mien, argumenté.", sign:"green", picto:"fork",
  opts:["A","B"], rule:"Chacun choisit A ou B. Ceux qui font le même choix que moi marquent 1 point. Le camp minoritaire doit défendre son choix à voix haute."},
 {id:"prix", name:"Devine le prix", pitch:"Rachats, enchères, transferts : le plus proche gagne.", sign:"blue", picto:"euro", closest:true,
  rule:"Le lecteur lit la question, chacun annonce un prix à voix haute. On révèle, puis on désigne le plus proche : 1 point."},
 {id:"google", name:"Le plus googlé", pitch:"Laquelle a le plus grimpé sur Google ?", sign:"paper", picto:"search",
  opts:["A","B"], rule:"D’après le classement officiel « L’année en recherches » de Google, laquelle des deux recherches a le plus progressé sur l’année ? Bonne réponse : 1 point."},
 {id:"avap", name:"Avant ou après ?", pitch:"La chronologie qui piège tout le monde.", sign:"yellow", picto:"swap", mine:true,
  opts:["Avant","Après"], rule:"Le premier événement s’est-il passé avant ou après le second ? Bonne réponse : 1 point. Les écarts sont parfois de quelques mois."},
 {id:"cote", name:"La cote de Claude", pitch:"J’ai donné ma probabilité. Devinez-la.", sign:"red", picto:"gauge", closest:true, mine:true,
  rule:"Pour chaque prédiction, j’ai fixé ma probabilité que ça arrive. Chacun annonce un pourcentage. Le plus proche de ma cote marque 1 point, puis on débat."}
];
const GM = Object.fromEntries(GAMES.map(g => [g.id, g]));
const DATA = {souvenir:SOUV, tp:TP, prix:PRIX, google:GOOG, avap:AVAP, cote:COTE};
const KEY = {souvenir:i=>i.n, tp:i=>i.a, prix:i=>i.q, google:i=>i.a+"|"+i.b, avap:i=>i.k||i.a, cote:i=>i.q};
const HORIZ = ["Moins de 100 ans","100 ans","300 ans","500 ans","1 000 ans et plus"];
const HYEAR = ["oublié avant 2126","encore connu en 2126","encore connu en 2326","encore connu en 2526","encore connu en 3026"];
const CAPS = [["#D7263D","#fff"],["#F6B800","#17130A"],["#1E8E4E","#fff"],["#2F6FD6","#fff"],["#8A55D9","#fff"],["#E8742A","#fff"],["#138F8F","#fff"],["#D6478B","#fff"]];

function answer(g, i){
  if (g==="souvenir") return i.v;
  if (g==="tp") return i.c==="a" ? 0 : 1;
  if (g==="google") return i.ra < i.rb ? 0 : 1;
  if (g==="avap") return i.ya < i.yb ? 0 : 1;
  return null;
}
function pointsFor(g, pick, ans){
  if (pick==null) return 0;
  if (g==="souvenir"){ const d = Math.abs(pick-ans); return d===0 ? 2 : d===1 ? 1 : 0; }
  return pick===ans ? 1 : 0;
}

/* ============ ÉTAT ============ */
const LS = "aire-de-jeux:v1";
function fresh(){
  return {players:[{id:"p1",name:"Aloys",score:0},{id:"p2",name:"Clacla",score:0},{id:"p3",name:"Coco",score:0},{id:"p4",name:"Soso",score:0}],
          seen:{}, cur:null, view:"home", editing:false, confirmReset:false};
}
function load(){
  try {
    const s = JSON.parse(localStorage.getItem(LS));
    if (s && Array.isArray(s.players) && s.players.length){
      /* Remplace les prénoms provisoires de la version 1 par l’équipage réel */
      const tmp = {"Pote 2":"Clacla","Pote 3":"Coco","Pote 4":"Soso"};
      s.players.forEach(p => { if (tmp[p.name]) p.name = tmp[p.name]; });
      return Object.assign(fresh(), s, {editing:false, confirmReset:false});
    }
  } catch(e){}
  return fresh();
}
let S = load();
function save(){ try { localStorage.setItem(LS, JSON.stringify(S)); } catch(e){} }

/* ============ OUTILS ============ */
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const ty = s => esc(s)
  .replace(/ ([?!;:%»])/g, " $1")
  .replace(/« /g, "« ")
  .replace(/(\d) (?=\d{3}(?!\d))/g, "$1 ");
const capOf = idx => CAPS[idx % CAPS.length];
const pIndex = id => S.players.findIndex(p => p.id === id);
const reduceMotion = () => window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
function toast(msg){
  const t = document.getElementById("toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(toast._t); toast._t = setTimeout(() => t.hidden = true, 2600);
}
let wake = null;
async function keepAwake(){
  try { if ("wakeLock" in navigator && !wake){ wake = await navigator.wakeLock.request("screen"); wake.addEventListener("release", () => wake = null); } } catch(e){}
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") { wake = null; } });

function currentItem(){
  if (!S.cur) return null;
  const pool = DATA[S.cur.game];
  return pool.find(i => KEY[S.cur.game](i) === S.cur.key) || null;
}
function draw(game){
  const pool = DATA[game], keyf = KEY[game];
  let seen = (S.seen[game] || []).filter(k => pool.some(i => keyf(i) === k));
  let unseen = pool.filter(i => !seen.includes(keyf(i)));
  if (!unseen.length){ seen = []; unseen = pool.slice(); toast("Toutes les cartes y sont passées : on remélange."); }
  const item = unseen[Math.floor(Math.random() * unseen.length)];
  seen.push(keyf(item)); S.seen[game] = seen;
  S.cur = {game, key:keyf(item), picks:{}, revealed:false, awarded:{}};
}
function leader(){
  const max = Math.max(...S.players.map(p => p.score));
  if (max <= 0) return "Personne n’a encore marqué. Tout reste à jouer.";
  const top = S.players.filter(p => p.score === max).map(p => p.name);
  return top.length === 1 ? `En tête : <b>${ty(top[0])}</b> avec ${max} point${max>1?"s":""}.` : `Égalité en tête : <b>${ty(top.join(", "))}</b> avec ${max} points.`;
}

/* ============ RENDU : JEU ============ */
function promptHTML(g, it, rev, ans){
  const sg = g.sign;
  if (g.id === "souvenir") return `<div class="sign ${sg}"><div class="in">
      <p class="eyebrow">${ty("On s’en souviendra encore dans…")}</p>
      <h2 class="big">${ty(it.n)}</h2><p class="sub">${ty(it.d)}</p></div></div>`;
  if (g.id === "tp" || g.id === "google"){
    const head = g.id === "tp" ? `<p class="eyebrow">Tu préfères…</p>`
      : `<p class="eyebrow">${ty(`Google ${it.s ? "Monde" : "France"} · ${it.y} · ${it.c}`)}</p><p class="sub">${ty("Laquelle a le plus grimpé dans les recherches ?")}</p>`;
    return `<div class="sign ${sg} ${rev ? "revealed" : ""}"><div class="in">${head}
      <div class="opt ${rev && ans===0 ? "chosen" : ""}"><span class="tag">A</span><span>${ty(it.a)}</span></div>
      <div class="or">ou</div>
      <div class="opt ${rev && ans===1 ? "chosen" : ""}"><span class="tag">B</span><span>${ty(it.b)}</span></div></div></div>`;
  }
  if (g.id === "prix") return `<div class="sign ${sg}"><div class="in"><p class="eyebrow">Devine le prix</p><h2 class="q">${ty(it.q)}</h2></div></div>`;
  if (g.id === "avap") return `<div class="sign ${sg}"><div class="in">
      <p class="eyebrow">${ty("Le 1 s’est-il passé avant ou après le 2 ?")}</p>
      <div class="opt"><span class="tag">1</span><span>${ty(it.a)}</span></div>
      <div class="or">avant ou après</div>
      <div class="opt"><span class="tag">2</span><span>${ty(it.b)}</span></div></div></div>`;
  if (g.id === "cote") return `<div class="sign ${sg}"><div class="in"><p class="eyebrow">Quelle est ma cote ?</p><h2 class="q">${ty(it.q)}</h2></div></div>`;
}

function picksHTML(g, ans){
  const c = S.cur, rev = c.revealed;
  if (g.closest){
    if (!rev) return `<p class="hint">${ty("Chacun annonce sa réponse à voix haute, puis on révèle.")}</p>`;
    return `<section class="picks"><h3 class="picks-h">Qui était le plus proche ?</h3>
      <p class="hint">${ty("Tape sur le ou les gagnants : 1 point chacun. Tape à nouveau pour annuler.")}</p>
      <div class="winners">${S.players.map((p, i) => `<button class="chip" style="--cap:${capOf(i)[0]}" data-act="win" data-p="${p.id}" aria-pressed="${!!c.awarded[p.id]}"><i></i>${esc(p.name)}${c.awarded[p.id] ? " +1" : ""}</button>`).join("")}</div>
    </section>`;
  }
  const wide = g.opts.length > 2;
  return `<section class="picks"><h3 class="picks-h">${rev ? "Les réponses" : "Qui dit quoi ?"}</h3>
    ${S.players.map((p, i) => { const pk = c.picks[p.id]; const aw = c.awarded[p.id];
      return `<div class="pick ${wide ? "wide" : ""}" style="--cap:${capOf(i)[0]}">
        <div class="pname"><i></i><span>${esc(p.name)}</span>${rev && aw ? `<b class="award">+${aw}</b>` : ""}<b class="sc">${p.score} pt${p.score>1?"s":""}</b></div>
        <div class="chips" style="--n:${g.opts.length}">${g.opts.map((o, v) => {
          let cls = "chip"; if (rev && v === ans) cls += " good"; else if (rev && g.id==="souvenir" && Math.abs(v-ans)===1) cls += " near";
          return `<button class="${cls}" data-act="pick" data-p="${p.id}" data-v="${v}" aria-pressed="${pk===v}" ${rev ? "disabled" : ""}>${ty(o)}</button>`; }).join("")}</div>
      </div>`; }).join("")}
  </section>`;
}

function pointsLine(){
  const a = S.cur.awarded, ids = Object.keys(a).filter(k => a[k] > 0 && pIndex(k) > -1);
  if (!ids.length) return `<p class="pts-line none">Personne ne marque sur cette carte.</p>`;
  return `<p class="pts-line">${ty(ids.map(k => `+${a[k]} ${S.players[pIndex(k)].name}`).join(", "))}</p>`;
}

function revealHTML(g, it, ans){
  if (g.id === "souvenir"){
    const pos = (ans + .5) / 5 * 100;
    return `<section class="reveal" id="rev"><p class="eyebrow">Mon verdict</p>
      <p class="verdict">${ty(HORIZ[ans])}</p>
      <div class="road" aria-label="${esc(HYEAR[ans])}">
        <div class="asphalt"><div class="fill" style="width:${pos}%"></div><div class="dash"></div><span class="car" style="left:${pos}%">${CAR}</span></div>
        <div class="marks">${["< 100","100","300","500","1 000+"].map((m, i) => `<span class="${i===ans?"on":""}">${ty(m)}<small>${["avant 2126","2126","2326","2526","3026"][i]}</small></span>`).join("")}</div>
      </div>
      <p class="why">${ty(it.w)}</p>${pointsLine()}</section>`;
  }
  if (g.id === "tp"){
    const t = S.players.reduce((acc, p) => { const v = S.cur.picks[p.id]; if (v===0) acc[0]++; if (v===1) acc[1]++; return acc; }, [0,0]);
    const tally = t[0] + t[1] ? `Dans la voiture : ${t[0]} pour A, ${t[1]} pour B.` : "";
    return `<section class="reveal" id="rev"><p class="eyebrow">Mon choix</p>
      <p class="verdict">${ans===0 ? "A" : "B"}</p><p class="why">${ty(it.w)}</p>
      ${tally ? `<p class="hint">${ty(tally)}</p>` : ""}${pointsLine()}</section>`;
  }
  if (g.id === "prix") return `<section class="reveal" id="rev"><p class="eyebrow">La réponse</p>
      <p class="verdict">${ty(it.r)}</p><p class="why">${ty(it.x)}</p></section>`;
  if (g.id === "google"){
    const rows = [[it.a, it.ra, ans===0], [it.b, it.rb, ans===1]].sort((x, y) => x[1] - y[1]);
    return `<section class="reveal" id="rev"><p class="eyebrow">${ty(`Classement Google ${it.s ? "Monde" : "France"} ${it.y} · ${it.c}`)}</p>
      <div class="ranks">${rows.map(r => `<div class="rank ${r[2] ? "win" : ""}"><em>${r[1]}<sup>${r[1]===1?"er":"e"}</sup></em><b>${ty(r[0])}</b></div>`).join("")}</div>
      ${it.x ? `<p class="why">${ty(it.x)}</p>` : ""}
      <p class="hint">${ty("Google classe les recherches qui ont le plus progressé sur l’année, pas forcément les plus nombreuses.")}</p>${pointsLine()}</section>`;
  }
  if (g.id === "avap"){
    const rows = [[it.a, it.la, it.ya, true], [it.b, it.lb, it.yb, false]].sort((x, y) => x[2] - y[2]);
    return `<section class="reveal" id="rev"><p class="eyebrow">La réponse</p>
      <p class="verdict">${ans===0 ? "Avant" : "Après"}</p>
      <div class="tl">${rows.map(r => `<div class="${r[3] ? "a" : ""}"><b>${ty(r[0])}</b><span>${ty(r[1])}</span></div>`).join("")}</div>
      <p class="why">${ty(it.w)}</p>${pointsLine()}</section>`;
  }
  if (g.id === "cote") return `<section class="reveal" id="rev"><p class="eyebrow">Ma cote</p>
      <p class="verdict">${it.p} %</p>
      <div><div class="gauge"><span style="width:${it.p}%"></span></div><div class="gauge-ticks"><span>0</span><span>25</span><span>50</span><span>75</span><span>100</span></div></div>
      <p class="why">${ty(it.w)}</p></section>`;
}

function renderGame(){
  const g = GM[S.cur.game], it = currentItem();
  if (!it){ draw(g.id); return renderGame(); }
  const rev = S.cur.revealed, ans = answer(g.id, it);
  const n = DATA[g.id].length, seen = (S.seen[g.id] || []).length;
  document.getElementById("app").innerHTML = `
  <div class="topbar"><div class="topbar-in">
    <button class="back" data-act="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>Aire</button>
    <span class="tb-title">${ty(g.name)}</span>
    <span class="tb-count">${seen}/${n}</span>
  </div></div>
  <main class="wrap">
    <details class="rule" ${S.ruleOpen && S.ruleOpen[g.id] ? "open" : ""} data-rule="${g.id}"><summary>Règle du jeu</summary><p>${ty(g.rule)}</p></details>
    ${promptHTML(g, it, rev, ans)}
    ${picksHTML(g, ans)}
    ${rev ? revealHTML(g, it, ans) : `<button class="btn primary" data-act="reveal">Révéler</button>`}
    <div class="nav">${rev ? `<button class="btn primary" data-act="next">Carte suivante</button>` : `<button class="btn ghost" data-act="next">Passer cette carte</button>`}</div>
  </main>`;
}

function render(){
  if (S.view === "game" && S.cur) renderGame(); else { S.view = "home"; renderHome(); }
  save();
}

/* ============ ACTIONS ============ */
const app = document.getElementById("app");
app.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  keepAwake();
  const act = b.dataset.act, pid = b.dataset.p;
  switch (act){
    case "open": {
      const gid = b.dataset.game;
      if (!S.cur || S.cur.game !== gid) draw(gid);
      S.view = "game"; render(); window.scrollTo(0, 0); return;
    }
    case "home": S.view = "home"; render(); window.scrollTo(0, 0); return;
    case "edit": S.editing = !S.editing; S.confirmReset = false; render(); return;
    case "add": {
      const id = "p" + Date.now().toString(36);
      S.players.push({id, name:"Pote " + (S.players.length + 1), score:0}); render();
      const inp = document.getElementById("pn-" + id); if (inp){ inp.focus(); inp.select(); } return;
    }
    case "del": if (S.players.length > 1){ S.players = S.players.filter(p => p.id !== pid); render(); } return;
    case "reset": S.confirmReset = true; render(); return;
    case "reset-no": S.confirmReset = false; render(); return;
    case "reset-yes": S.players.forEach(p => p.score = 0); S.confirmReset = false; render(); toast("Scores remis à zéro."); return;
    case "pick": {
      if (S.cur.revealed) return;
      const v = +b.dataset.v; S.cur.picks[pid] = S.cur.picks[pid] === v ? undefined : v;
      if (S.cur.picks[pid] === undefined) delete S.cur.picks[pid];
      render(); return;
    }
    case "reveal": {
      const g = GM[S.cur.game], it = currentItem(), ans = answer(g.id, it);
      if (!g.closest){
        S.players.forEach(p => { const pts = pointsFor(g.id, S.cur.picks[p.id], ans); if (pts){ S.cur.awarded[p.id] = pts; p.score += pts; } });
      }
      S.cur.revealed = true; render();
      const r = document.getElementById("rev"); if (r) r.scrollIntoView({behavior: reduceMotion() ? "auto" : "smooth", block:"start"});
      return;
    }
    case "win": {
      const p = S.players[pIndex(pid)]; if (!p) return;
      if (S.cur.awarded[pid]){ p.score -= 1; delete S.cur.awarded[pid]; } else { p.score += 1; S.cur.awarded[pid] = 1; }
      render(); return;
    }
    case "next": draw(S.cur.game); render(); window.scrollTo(0, 0); return;
  }
});
app.addEventListener("input", e => {
  const pid = e.target.dataset && e.target.dataset.pid; if (!pid) return;
  const p = S.players[pIndex(pid)]; if (p){ p.name = e.target.value.trim() || "Passager"; save(); }
});
app.addEventListener("toggle", e => {
  const d = e.target; if (!d.dataset || !d.dataset.rule) return;
  S.ruleOpen = S.ruleOpen || {}; S.ruleOpen[d.dataset.rule] = d.open; save();
}, true);

render();
</script>

<script>
if ("serviceWorker" in navigator) {
  addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
