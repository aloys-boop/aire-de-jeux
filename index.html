<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E5E8EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111316" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Aire de jeux">
<meta name="description" content="Jeux de route entre potes : On s’en souviendra ?, Tu préfères, Devine le prix et d’autres.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Aire de jeux</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Overpass:wght@400;600;700;800&family=Overpass+Mono:wght@600;700&display=swap">
<style>
/* Concept : une aire d’autoroute. Chaque jeu est un panneau de signalisation français
   (bleu autoroute, marron patrimoine, vert direction, blanc local, jaune déviation),
   les joueurs sont des bornes kilométriques, le marquage jaune sert d’accent. */
:root{
  --bg:#E5E8EC; --surface:#FFFFFF; --surface-2:#F0F2F5; --ink:#13171C; --muted:#55606B; --line:#D2D8DF;
  --sign-blue:#1A4E9B; --sign-brown:#7B4628; --sign-green:#0F7148; --sign-paper:#F8F8F4; --sign-ink:#111111; --sign-red:#C8102E;
  --yellow:#F6B800; --on-yellow:#17130A; --good:#1C8A4B; --near:#B87D00; --asphalt:#2A2F35; --borne:#F4F4F0;
  --shadow:0 1px 0 rgb(0 0 0 / .16), 0 12px 26px -16px rgb(10 25 50 / .5);
  --f-display:"Barlow Condensed","Arial Narrow","Roboto Condensed",sans-serif;
  --f-body:"Overpass","Helvetica Neue",Arial,sans-serif;
  --f-num:"Overpass Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111316; --surface:#1B1E22; --surface-2:#23272C; --ink:#ECEEF1; --muted:#9AA3AD; --line:#2E3339;
    --good:#3DBA72; --near:#E3A920; --asphalt:#0A0B0D; --borne:#ECECE6;
    --shadow:0 1px 0 rgb(0 0 0 / .5), 0 14px 30px -16px rgb(0 0 0 / .9); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111316; --surface:#1B1E22; --surface-2:#23272C; --ink:#ECEEF1; --muted:#9AA3AD; --line:#2E3339;
  --good:#3DBA72; --near:#E3A920; --asphalt:#0A0B0D; --borne:#ECECE6;
  --shadow:0 1px 0 rgb(0 0 0 / .5), 0 14px 30px -16px rgb(0 0 0 / .9); color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg); color:var(--ink); font-family:var(--f-body); font-size:16px; line-height:1.5;
  padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color:transparent;
}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top, 0px); z-index:10; background:var(--bg)}
button{font:inherit; color:inherit; cursor:pointer}
button:focus-visible, input:focus-visible, summary:focus-visible{outline:3px solid var(--yellow); outline-offset:2px}
.wrap{max-width:560px; margin:0 auto; padding-block:16px 56px; display:flex; flex-direction:column; gap:24px}
h1,h2,h3{text-wrap:balance; margin:0}
p{margin:0}

/* Panneaux */
.sign{--c:var(--sign-blue); --fg:#fff; --bd:#fff; --bw:2.5px;
  display:block; width:100%; background:var(--c); color:var(--fg); border:0; border-radius:16px; padding:5px;
  box-shadow:var(--shadow); text-align:left}
.sign > .in{position:relative; display:flex; flex-direction:column; gap:8px; height:100%;
  border:var(--bw) solid var(--bd); border-radius:11px; padding:16px 16px 18px}
.sign.brown{--c:var(--sign-brown)}
.sign.green{--c:var(--sign-green)}
.sign.paper{--c:var(--sign-paper); --fg:var(--sign-ink); --bd:var(--sign-ink)}
.sign.red{--c:var(--sign-paper); --fg:var(--sign-ink); --bd:var(--sign-red); --bw:6px}
.sign.red > .in{padding:14px 14px 16px}
.sign.yellow{--c:var(--yellow); --fg:var(--on-yellow); --bd:var(--on-yellow)}
.picto{width:34px; height:34px; display:block}
.picto svg{width:100%; height:100%; display:block}

/* En-tête */
.hero .in{gap:12px; padding:18px 18px 16px}
.hero-row{display:flex; align-items:flex-start; justify-content:space-between; gap:12px}
.hero h1{font-family:var(--f-display); line-height:.9; display:flex; flex-direction:column}
.hero h1 span{font-weight:600; font-size:24px; letter-spacing:.01em}
.hero h1 b{font-weight:800; font-size:clamp(58px,17vw,76px); letter-spacing:-.01em}
.dist{font:700 30px/1 var(--f-display); white-space:nowrap; padding-top:4px}
.hero-sub{font-size:15px; line-height:1.45; max-width:40ch; opacity:.92}
.services{display:flex; gap:6px; flex-wrap:wrap}
.svc{width:34px; height:34px; border-radius:6px; background:#fff; color:var(--sign-blue); display:grid; place-items:center}
.svc svg{width:22px; height:22px}

/* Sections */
.sec{display:flex; flex-direction:column; gap:12px}
.sec-head{display:flex; align-items:baseline; justify-content:space-between; gap:12px}
.sec-head h2{font:800 26px/1 var(--f-display); letter-spacing:.01em}
.link{background:none; border:0; padding:6px 0; font-weight:700; font-size:15px; color:var(--muted); text-decoration:underline; text-underline-offset:3px}

/* Bornes kilométriques = joueurs */
.bornes{display:flex; gap:12px; overflow-x:auto; padding:2px 2px 8px}
.borne{flex:0 0 auto; width:62px; display:flex; flex-direction:column; align-items:center}
.borne .b{width:58px; height:84px; border-radius:29px 29px 5px 5px; background:var(--borne); overflow:hidden;
  display:flex; flex-direction:column; align-items:center; box-shadow:inset 0 -7px 0 rgb(0 0 0 / .08), var(--shadow)}
.borne .cap{width:100%; height:36px; background:var(--cap); color:var(--capfg); padding:9px 4px 0;
  font:700 13px/1.2 var(--f-display); text-transform:uppercase; letter-spacing:.04em; text-align:center;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.borne .num{font:700 24px/1 var(--f-num); color:#111; margin-top:12px; font-variant-numeric:tabular-nums}
.leader{font-size:14px; color:var(--muted)}
.leader b{color:var(--ink)}

/* Édition de l’équipage */
.editor{display:flex; flex-direction:column; gap:8px; background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:12px}
.ed-row{display:grid; grid-template-columns:12px minmax(0,1fr) auto; align-items:center; gap:10px}
.ed-row i{width:12px; height:12px; border-radius:3px; background:var(--cap)}
.ed-row input{width:100%; min-height:44px; border:1.5px solid var(--line); border-radius:10px; background:var(--surface-2); color:var(--ink); padding:0 12px; font:600 16px var(--f-body)}
.ed-del{min-width:44px; min-height:44px; border-radius:10px; border:1.5px solid var(--line); background:transparent; font-weight:800; color:var(--muted)}
.ed-actions{display:flex; gap:8px; flex-wrap:wrap}
.btn-s{min-height:44px; padding:0 14px; border-radius:10px; border:1.5px solid var(--line); background:var(--surface-2); font-weight:700; font-size:15px}
.btn-s.solid{background:var(--ink); color:var(--bg); border-color:var(--ink)}
.btn-s.warn{border-color:var(--sign-red); color:var(--sign-red); background:transparent}

/* Portique des jeux */
.gantry{display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:12px}
.game-sign{cursor:pointer; transition:transform .12s ease}
.game-sign:active{transform:translateY(2px) scale(.99)}
.game-sign .in{min-height:168px; gap:6px}
.gname{font:700 clamp(20px,5.9vw,25px)/1.02 var(--f-display); margin-top:6px}
.gpitch{font-size:13px; line-height:1.35; opacity:.88}
.mine{position:absolute; top:10px; right:10px; font:700 10px/1 var(--f-body); letter-spacing:.08em; text-transform:uppercase;
  background:var(--fg); color:var(--c); padding:5px 6px 4px; border-radius:4px}
.sign.red .mine{background:var(--sign-red); color:#fff}
.cnt{margin-top:auto; font:600 12px var(--f-num); opacity:.75}

.howto{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:16px; display:flex; flex-direction:column; gap:8px}
.howto h3{font:800 20px/1.1 var(--f-display)}
.howto ol{margin:0; padding-left:20px; display:flex; flex-direction:column; gap:4px; font-size:15px}
.foot{font-size:13px; color:var(--muted); line-height:1.5}

/* Écran de jeu */
.topbar{position:sticky; top:env(safe-area-inset-top, 0px); z-index:20; background:var(--bg); border-bottom:1px solid var(--line);
  margin-left:calc(-1 * max(16px, env(safe-area-inset-left, 0px))); margin-right:calc(-1 * max(16px, env(safe-area-inset-right, 0px)));
  padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px))}
.topbar-in{max-width:560px; margin:0 auto; display:grid; grid-template-columns:auto minmax(0,1fr) auto; align-items:center; gap:10px; min-height:56px}
.back{min-height:44px; padding:0 12px 0 8px; border-radius:10px; border:1.5px solid var(--line); background:var(--surface); font-weight:800; font-size:15px; display:flex; align-items:center; gap:4px}
.back svg{width:18px; height:18px}
.tb-title{font:800 20px/1 var(--f-display); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.tb-count{font:700 13px var(--f-num); color:var(--muted); font-variant-numeric:tabular-nums}
.rule{font-size:15px; color:var(--muted)}
.rule summary{cursor:pointer; font-weight:700; color:var(--ink); list-style:none; display:flex; align-items:center; gap:6px; min-height:32px}
.rule summary::-webkit-details-marker{display:none}
.rule summary::before{content:"+"; display:inline-grid; place-items:center; width:20px; height:20px; border-radius:5px; background:var(--surface-2); border:1px solid var(--line); font-weight:800}
.rule[open] summary::before{content:"−"}
.rule p{padding-top:6px; max-width:62ch}

.eyebrow{font:700 12px/1.3 var(--f-body); letter-spacing:.12em; text-transform:uppercase}
.sign .eyebrow{opacity:.85}
.big{font:800 clamp(36px,11vw,50px)/.98 var(--f-display); letter-spacing:-.005em}
.sub{font-size:16px; opacity:.9}
.q{font:700 clamp(25px,7vw,32px)/1.1 var(--f-display)}
.opt{display:flex; gap:12px; align-items:flex-start; font:700 clamp(23px,6.4vw,29px)/1.1 var(--f-display); transition:opacity .2s}
.opt .tag{flex:none; width:32px; height:32px; border-radius:7px; background:var(--fg); color:var(--c); font:800 20px/33px var(--f-display); text-align:center}
.sign.paper .opt .tag, .sign.red .opt .tag{color:var(--sign-paper)}
.or{font:700 12px/1 var(--f-body); letter-spacing:.16em; text-transform:uppercase; opacity:.75; padding:4px 0 4px 44px}
.revealed .opt:not(.chosen){opacity:.45}
.opt.chosen .tag{background:var(--yellow); color:var(--on-yellow)}
.sign.yellow .opt.chosen .tag{background:var(--on-yellow); color:var(--yellow)}

.picks{display:flex; flex-direction:column; gap:8px}
.picks-h{font:800 20px/1.1 var(--f-display)}
.hint{font-size:15px; color:var(--muted)}
.pick{display:grid; grid-template-columns:minmax(0,1fr) auto; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:8px 8px 8px 12px}
.pick.wide{grid-template-columns:minmax(0,1fr); padding:10px}
.pname{display:flex; align-items:center; gap:8px; font-weight:700; min-width:0}
.pname i{flex:none; width:10px; height:10px; border-radius:3px; background:var(--cap)}
.pname span{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.pname .sc{margin-left:auto; font:700 13px var(--f-num); color:var(--muted); font-variant-numeric:tabular-nums}
.award{font:700 13px var(--f-num); color:var(--good); white-space:nowrap}
.chips{display:grid; grid-template-columns:repeat(var(--n), minmax(0,1fr)); gap:6px}
.pick:not(.wide) .chips{grid-template-columns:repeat(var(--n), minmax(62px,auto))}
.chip{min-height:46px; border-radius:10px; border:1.5px solid var(--line); background:var(--surface-2); color:var(--ink);
  font:700 15px var(--f-body); padding:0 10px; font-variant-numeric:tabular-nums; transition:background .12s, color .12s}
.chip[aria-pressed="true"]{background:var(--ink); color:var(--bg); border-color:var(--ink)}
.chip:disabled{cursor:default}
.chip.good{box-shadow:0 0 0 3px var(--good)}
.chip.near{box-shadow:0 0 0 3px var(--near)}
.winners{display:flex; flex-wrap:wrap; gap:8px}
.winners .chip{display:flex; align-items:center; gap:8px; padding:0 14px}
.winners .chip i{width:10px; height:10px; border-radius:3px; background:var(--cap)}

.btn{display:block; width:100%; min-height:58px; border-radius:14px; border:0; font:800 18px var(--f-body); letter-spacing:.01em}
.btn.primary{background:var(--yellow); color:var(--on-yellow); box-shadow:inset 0 -4px 0 rgb(0 0 0 / .18)}
.btn.primary:active{transform:translateY(1px)}
.btn.ghost{background:transparent; color:var(--muted); border:1.5px dashed var(--line); min-height:48px; font-size:15px; font-weight:700}
.nav{display:flex; flex-direction:column; gap:10px}

.reveal{scroll-margin-top:72px; background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:18px; display:flex; flex-direction:column; gap:14px; animation:pop .32s ease-out}
.reveal .eyebrow{color:var(--muted)}
.verdict{font:800 clamp(38px,11vw,48px)/1 var(--f-display)}
.why{font-size:16.5px; line-height:1.58; max-width:62ch}
.pts-line{font-size:15px; font-weight:700; color:var(--good)}
.pts-line.none{color:var(--muted); font-weight:600}
@keyframes pop{from{transform:translateY(8px); opacity:.4} to{transform:none; opacity:1}}

.road{display:flex; flex-direction:column; gap:8px}
.asphalt{position:relative; height:44px; border-radius:8px; background:var(--asphalt)}
.asphalt .fill{position:absolute; inset:0 auto 0 0; border-radius:8px; background:linear-gradient(90deg, rgb(246 184 0 / 0), rgb(246 184 0 / .38))}
.asphalt .dash{position:absolute; left:10px; right:10px; top:50%; height:3px; margin-top:-1.5px; background:repeating-linear-gradient(90deg,#F4F4F0 0 14px, transparent 14px 26px)}
.asphalt .car{position:absolute; top:50%; width:38px; height:24px; transform:translate(-50%,-50%); color:var(--yellow)}
.asphalt .car svg{width:100%; height:100%; display:block}
.marks{display:grid; grid-template-columns:repeat(5, minmax(0,1fr)); text-align:center; font:600 12px var(--f-num); color:var(--muted)}
.marks span.on{color:var(--ink); font-weight:700}
.marks small{display:block; font-size:10px; opacity:.8}

.gauge{position:relative; height:20px; border-radius:10px; background:var(--surface-2); border:1px solid var(--line); overflow:hidden}
.gauge span{position:absolute; inset:0 auto 0 0; background:var(--sign-red)}
.gauge-ticks{display:flex; justify-content:space-between; font:600 11px var(--f-num); color:var(--muted)}

.tl{display:flex; flex-direction:column; gap:0; border-left:3px solid var(--line); margin-left:6px}
.tl div{position:relative; padding:4px 0 12px 16px}
.tl div::before{content:""; position:absolute; left:-8.5px; top:9px; width:14px; height:14px; border-radius:50%; background:var(--surface); border:3px solid var(--ink)}
.tl div.a::before{background:var(--yellow); border-color:var(--yellow)}
.tl b{display:block; font-size:16px; line-height:1.3}
.tl span{font:600 13px var(--f-num); color:var(--muted)}

.ranks{display:flex; flex-direction:column; gap:8px}
.rank{display:grid; grid-template-columns:auto minmax(0,1fr); gap:12px; align-items:center; padding:10px 12px; border-radius:12px; background:var(--surface-2)}
.rank b{font:800 22px/1 var(--f-display)}
.rank em{font-style:normal; font:700 13px var(--f-num); display:inline-grid; place-items:center; min-width:46px; height:30px; border-radius:7px; background:var(--line); color:var(--ink); padding:0 6px}
.rank.win em{background:var(--yellow); color:var(--on-yellow)}

.toast{position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom, 0px)); transform:translateX(-50%); z-index:50;
  background:var(--ink); color:var(--bg); padding:12px 16px; border-radius:12px; font-weight:700; font-size:14px; max-width:calc(100% - 32px); box-shadow:var(--shadow)}

/* Version 2 : panneau large, débat, mensonge, votes */
.opt.small{font:700 clamp(19px,5.3vw,22px)/1.2 var(--f-display); padding-block:2px}
.chip{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.chip:disabled:not([aria-pressed="true"]):not(.good):not(.near){opacity:.42}
.tags{position:absolute; top:10px; right:10px; display:flex; flex-direction:column; align-items:flex-end; gap:4px}
.tags .mine, .tags .new{position:static}
.game-sign.wide{grid-column:1 / -1}
.game-sign.wide .in{min-height:0; padding-right:18px}
.game-sign.wide .gname{font-size:30px}
.new{position:absolute; top:10px; right:10px; font:800 10px/1 var(--f-body); letter-spacing:.08em; text-transform:uppercase;
  background:var(--yellow); color:var(--on-yellow); padding:5px 6px 4px; border-radius:4px}
.spicy{display:inline-flex; align-items:center; gap:6px; align-self:flex-start; font:800 11px/1 var(--f-body); letter-spacing:.08em; text-transform:uppercase;
  background:var(--sign-red); color:#fff; padding:6px 8px 5px; border-radius:5px}
.camps{display:flex; flex-direction:column; gap:6px}
.members{display:flex; flex-wrap:wrap; gap:6px; padding-left:44px}
.member{display:inline-flex; align-items:center; gap:6px; font:700 14px/1 var(--f-body); background:rgb(255 255 255 / .16); border:1.5px solid rgb(255 255 255 / .5); padding:6px 9px 5px; border-radius:20px}
.member i{width:9px; height:9px; border-radius:3px; background:var(--cap)}
.judge{font-size:14px; opacity:.9; padding-left:44px}

.panel{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:16px; display:flex; flex-direction:column; gap:12px}
.panel h3{font:800 20px/1.1 var(--f-display)}
.rounds{display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:6px}
.rd{border-radius:9px; padding:7px 6px 6px; background:var(--surface-2); border:1.5px solid var(--line); font:700 12px/1.25 var(--f-body); color:var(--muted); text-align:center}
.rd b{display:block; font:800 15px/1.1 var(--f-display); color:var(--ink)}
.rd.on{border-color:var(--ink); background:var(--ink); color:var(--bg)}
.rd.on b{color:var(--bg)}
.rd.done{opacity:.5}
.clock-row{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap}
.clock-who{font:800 22px/1.1 var(--f-display); min-width:0}
.clock-who small{display:block; font:700 13px/1.3 var(--f-body); color:var(--muted)}
.clock{font:700 50px/1 var(--f-num); font-variant-numeric:tabular-nums; letter-spacing:-.02em}
.clock.over{color:var(--sign-red); animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
.clock-bar{height:8px; border-radius:4px; background:var(--surface-2); overflow:hidden}
.clock-bar span{display:block; height:100%; background:var(--yellow); transition:width .2s linear}
.row-btns{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:8px}
.row-btns .btn{min-height:52px; font-size:16px}
.btn.dark{background:var(--ink); color:var(--bg)}
.btn.line{background:transparent; color:var(--ink); border:1.5px solid var(--line)}
.jokers{display:grid; grid-template-columns:minmax(0,1fr); gap:10px}
.joker{border-radius:12px; border:1.5px solid var(--line); padding:12px; display:flex; flex-direction:column; gap:8px}
.joker h4{margin:0; font:800 17px/1.15 var(--f-display)}
.joker ul{margin:0; padding-left:18px; display:flex; flex-direction:column; gap:6px; font-size:15px; line-height:1.4}
.joker .btn-s{align-self:flex-start}

.tally{display:flex; flex-direction:column; gap:8px}
.tl-row{display:grid; grid-template-columns:minmax(0,7.5em) minmax(0,1fr) 2.2em; align-items:center; gap:10px; font-weight:700}
.tl-row span:first-child{display:flex; align-items:center; gap:7px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.tl-row span:first-child i{flex:none; width:10px; height:10px; border-radius:3px; background:var(--cap)}
.tl-bar{height:22px; border-radius:6px; background:var(--surface-2); overflow:hidden}
.tl-bar b{display:block; height:100%; background:var(--line)}
.tl-row.top .tl-bar b{background:var(--yellow)}
.tl-row em{font:700 15px var(--f-num); font-style:normal; text-align:right; font-variant-numeric:tabular-nums}

.stmts{display:flex; flex-direction:column; gap:8px}
.stmt{display:grid; grid-template-columns:auto minmax(0,1fr); gap:10px; align-items:start; padding:10px 12px; border-radius:12px; background:var(--surface-2)}
.stmt em{font-style:normal; font:800 12px/1 var(--f-body); letter-spacing:.06em; text-transform:uppercase; padding:6px 7px 5px; border-radius:5px; background:var(--good); color:#fff}
.stmt.lie{box-shadow:inset 0 0 0 2px var(--sign-red)}
.stmt.lie em{background:var(--sign-red)}
.stmt span{font-size:15.5px; line-height:1.4}

/* Version 3 : plaque d’immatriculation, bingo, source des prix */
.plate{display:grid; grid-template-columns:auto minmax(0,1fr) auto; height:76px; border:3px solid #111; border-radius:9px; background:#FDFDFB; color:#111; overflow:hidden; box-shadow:var(--shadow)}
.plate .band{width:42px; background:#1D3C9C; color:#fff; display:flex; flex-direction:column; align-items:center; justify-content:space-between; padding:7px 0 6px; font:700 17px/1 var(--f-body)}
.plate .band svg{width:24px; height:24px}
.plate .reg{display:grid; place-items:center; font:800 clamp(25px,8vw,36px)/1 var(--f-display); letter-spacing:.03em; white-space:nowrap; overflow:hidden}
.plate .dep{font:800 22px/1 var(--f-display)}
.plate .logo{width:22px; height:16px; border-radius:3px; background:rgb(255 255 255 / .85)}
.lookup{display:flex; flex-direction:column; gap:8px}
.lookup input{width:100%; min-height:48px; border:1.5px solid var(--line); border-radius:10px; background:var(--surface-2); color:var(--ink); padding:0 14px; font:700 20px var(--f-num); letter-spacing:.04em}
.lookup output{font-size:16px; font-weight:700; min-height:1.5em}
.lookup output span{font-weight:400; color:var(--muted)}
.route{display:inline-flex; align-self:flex-start; font:800 11px/1 var(--f-body); letter-spacing:.08em; text-transform:uppercase; background:var(--yellow); color:var(--on-yellow); padding:6px 8px 5px; border-radius:5px}
.win-group{display:flex; flex-direction:column; gap:8px}
.src{font-size:13px; color:var(--muted)}
.src a{color:inherit}

.bgrid{display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:7px}
.bcell{position:relative; min-height:96px; border-radius:10px; border:1.5px solid var(--line); background:var(--surface); color:var(--ink);
  padding:8px 5px 18px; font:700 12.5px/1.2 var(--f-body); text-align:center; display:flex; align-items:center; justify-content:center; hyphens:auto; -webkit-hyphens:auto; overflow-wrap:break-word}
.bcell.found{background:var(--cap); color:var(--capfg); border-color:transparent}
.bcell.sel{outline:3px solid var(--yellow); outline-offset:1px}
.bcell .who{position:absolute; left:0; right:0; bottom:5px; font:800 10px/1 var(--f-body); letter-spacing:.06em; text-transform:uppercase; opacity:.9}
.bpanel{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:14px; display:flex; flex-direction:column; gap:10px; animation:pop .25s ease-out}
.bpanel p{font-weight:700}
.bstats{display:flex; flex-wrap:wrap; gap:8px; font-size:14px; color:var(--muted)}
.bstats b{color:var(--ink)}

@media (max-width:360px){ .gantry{grid-template-columns:minmax(0,1fr)} .game-sign .in{min-height:0} .rounds{grid-template-columns:repeat(2, minmax(0,1fr))} .bcell{font-size:12px; min-height:88px} }
@media (prefers-reduced-motion: reduce){ *{animation:none!important; transition:none!important} }
</style>

/* On s’en souviendra ? v : 0 = moins de 100 ans, 1 = 100 ans, 2 = 300 ans, 3 = 500 ans, 4 = 1 000 ans et plus */
const SOUV = [
 {n:"Adolf Hitler", d:"Dictateur nazi (1889-1945)", v:4, w:"La Seconde Guerre mondiale et la Shoah sont les événements les plus documentés de l’histoire humaine. Son nom sert déjà de mot pour dire « le mal absolu ». Néron et Attila sont toujours cités 1 500 à 2 000 ans après leur mort : il les rejoindra."},
 {n:"Cristiano Ronaldo", d:"Footballeur portugais, 5 Ballons d’or", v:1, w:"Dans 100 ans, les fans de foot le connaîtront encore, comme on connaît Pelé aujourd’hui. Au-delà, les sportifs ne traversent pas les époques : les sports changent et les records tombent. Qui connaît le meilleur jouteur de l’an 1400 ? Personne."},
 {n:"Napoléon Bonaparte", d:"Empereur des Français (1769-1821)", v:4, w:"Déjà 200 ans et toujours le Français le plus étudié au monde. Son Code civil inspire encore le droit de dizaines de pays. C’est le Jules César de l’époque moderne, et César tient depuis 2 000 ans."},
 {n:"Albert Einstein", d:"Physicien, théorie de la relativité", v:4, w:"Son nom est devenu un nom commun pour dire « génie », et E = mc² est l’équation la plus célèbre du monde. Archimède est encore connu 2 200 ans après lui pour bien moins que ça."},
 {n:"Elon Musk", d:"Patron de Tesla et de SpaceX", v:2, w:"Tout dépend de Mars. Si SpaceX y pose les premiers humains, il devient le Christophe Colomb du XXIe siècle et passe à 1 000 ans. Sinon, il finit comme Rockefeller : un nom qui veut dire « très riche », sans plus. Je mise sur 300 ans."},
 {n:"Kylian Mbappé", d:"Footballeur, champion du monde 2018", v:0, w:"Qui connaît Raymond Kopa, Ballon d’or 1958 ? Presque plus personne, moins de 70 ans après. Sauf s’il gagne trois Coupes du monde, Mbappé prendra le même chemin."},
 {n:"Lionel Messi", d:"Footballeur argentin, 8 Ballons d’or", v:1, w:"Même verdict que Ronaldo : une légende pour les fans pendant un siècle, puis une ligne dans les livres de sport. Le duel Messi-Ronaldo survivra peut-être mieux que chacun des deux séparément."},
 {n:"Steve Jobs", d:"Cofondateur d’Apple, père de l’iPhone", v:1, w:"Qui connaît George Eastman, le fondateur de Kodak ? Kodak a pourtant été aussi incontournable qu’Apple. Les entrepreneurs survivent quand leur nom est sur le produit, comme Ford ou Disney. Le sien n’y est pas."},
 {n:"Marie Curie", d:"Physicienne, deux prix Nobel", v:4, w:"Son nom est gravé dans le tableau périodique (le curium) et dans une unité de mesure (le curie). Les noms d’unités ne meurent jamais : demande à Volta, Ampère ou Newton."},
 {n:"Michael Jackson", d:"Le roi de la pop", v:2, w:"Énorme différence avec les stars d’avant : sa musique est enregistrée et ne disparaîtra pas. Thriller reste l’album le plus vendu de l’histoire et le moonwalk est un pas universel. Pour 1 000 ans, il faudrait qu’on enseigne la pop comme on enseigne Mozart."},
 {n:"Les Beatles", d:"Groupe anglais des années 1960", v:3, w:"Ils sont déjà étudiés dans les conservatoires. Dans 500 ans, ils seront à la pop ce que Bach est au baroque : les fondateurs qu’on cite pour expliquer tout le reste."},
 {n:"Kim Kardashian", d:"Star de téléréalité et d’Instagram", v:0, w:"Célèbre pour être célèbre. Les « it-girls » des années 1920 étaient aussi connues qu’elle à leur époque. Tu peux en citer une ?"},
 {n:"Charles de Gaulle", d:"Général, président de 1959 à 1969", v:3, w:"L’homme du 18 Juin et le fondateur de la Ve République. En France, il a le profil de Jeanne d’Arc : le sauveur de la nation. Elle tient depuis 600 ans, il tiendra au moins 500."},
 {n:"Emmanuel Macron", d:"Président de la République depuis 2017", v:1, w:"Qui connaît Gaston Doumergue, président de 1924 à 1931 ? Après un siècle, seuls les présidents liés à une guerre ou à un changement de régime restent dans les conversations. Les autres restent dans les manuels."},
 {n:"Donald Trump", d:"45e et 47e président des États-Unis", v:2, w:"Grover Cleveland a aussi fait deux mandats non consécutifs, et presque personne ne le connaît. Mais l’époque de Trump, avec les réseaux sociaux et la polarisation, sera énormément étudiée par les historiens. Je dis 300 ans."},
 {n:"Barack Obama", d:"44e président des États-Unis", v:2, w:"Les « premiers » traversent les siècles : premier président noir des États-Unis, il sera cité aussi longtemps qu’on racontera l’histoire américaine. Au-delà de 300 ans, seuls Washington et Lincoln semblent partis pour durer."},
 {n:"Neil Armstrong", d:"Premier homme sur la Lune", v:4, w:"Même si on vit un jour sur Mars, le premier pas sur un autre monde restera un moment fondateur. C’est notre Christophe Colomb, et 530 ans plus tard, tout le monde connaît Colomb."},
 {n:"Youri Gagarine", d:"Premier humain dans l’espace (1961)", v:3, w:"Les « premiers » ne s’oublient pas. Mais dans 1 000 ans, le premier pas sur la Lune risque de lui voler la vedette dans les récits. En Russie, en revanche, il est éternel."},
 {n:"Thomas Pesquet", d:"Astronaute français", v:0, w:"Qui connaît Jean-Loup Chrétien ? C’était le premier Français dans l’espace, en 1982. Être le plus populaire ne suffit pas, il faut être le premier."},
 {n:"Léonard de Vinci", d:"Peintre de La Joconde", v:4, w:"Déjà 500 ans, et La Joconde reste le tableau le plus célèbre du monde. Artiste et inventeur à la fois, il a une place réservée dans tous les récits de la Renaissance."},
 {n:"Squeezie", d:"Youtubeur français", v:0, w:"Les youtubeurs seront comme les animateurs radio des années 1950 : toute une génération s’en souvient, la suivante non."},
 {n:"Jul", d:"Rappeur marseillais, recordman des disques d’or", v:0, w:"Le record de ventes de disques de 1925 ne dit rien à personne aujourd’hui. Les records commerciaux s’effacent ; ce qui reste, c’est ce qui change un genre musical."},
 {n:"Zinédine Zidane", d:"Champion du monde 1998", v:1, w:"Le coup de tête de 2006 est passé dans la culture populaire, comme la « main de Dieu » de Maradona. Ça peut lui valoir un siècle, pas plus."},
 {n:"Mozart", d:"Compositeur autrichien (1756-1791)", v:4, w:"230 ans après sa mort, on le joue chaque soir quelque part dans le monde. Le répertoire classique s’est figé autour de quelques noms, et le sien est en haut de la liste."},
 {n:"Taylor Swift", d:"Chanteuse américaine", v:1, w:"La tournée la plus lucrative de l’histoire, mais les records de ventes ne font pas l’éternité. Dans 100 ans, elle sera le symbole d’une époque. Dans 300 ans, une note de bas de page de l’histoire de la pop."},
 {n:"Gustave Eiffel", d:"Ingénieur de la tour Eiffel", v:4, w:"Tant que la tour existera, ou qu’on la verra dans les livres, son nom sera prononcé tous les jours par des millions de gens. La meilleure façon de survivre : donner son nom à un monument."},
 {n:"Louis Pasteur", d:"Vaccin contre la rage, pasteurisation", v:4, w:"Son nom est devenu un verbe : pasteuriser. Ça, c’est l’immortalité garantie."},
 {n:"Bill Gates", d:"Fondateur de Microsoft", v:1, w:"Il deviendra le Rockefeller du numérique : un nom qui veut dire « milliardaire », puis qui s’efface. Sa fondation contre le paludisme pourrait le sauver, mais les philanthropes restent rarement célèbres longtemps."},
 {n:"Warren Buffett", d:"Investisseur, l’oracle d’Omaha", v:0, w:"Les investisseurs passent rarement le siècle. Qui connaît Jesse Livermore, le spéculateur le plus célèbre des années 1920 ? Les pros de la finance, et c’est tout."},
 {n:"Nelson Mandela", d:"Président sud-africain, prix Nobel de la paix", v:3, w:"Il est devenu un symbole universel. Les symboles moraux résistent mieux que les dirigeants : on cite encore Spartacus 2 000 ans après."},
 {n:"Martin Luther King", d:"Pasteur, « I have a dream »", v:3, w:"Un discours connu dans le monde entier et un jour férié à son nom aux États-Unis. Les grandes phrases survivent à leurs auteurs, et la sienne l’emporte avec elle."},
 {n:"Gandhi", d:"Figure de l’indépendance indienne", v:4, w:"Le symbole mondial de la non-violence et le père de l’Inde moderne, pays le plus peuplé du monde. Son visage est sur tous les billets indiens. L’Inde ne le laissera pas tomber dans l’oubli."},
 {n:"Coco Chanel", d:"Créatrice de mode", v:3, w:"Elle a fait de son nom une marque, la meilleure assurance contre l’oubli. Tant que le n° 5 se vendra, on prononcera Chanel. Le risque : qu’on oublie qu’il y avait une femme derrière."},
 {n:"Louis Vuitton", d:"Malletier (1821-1892)", v:3, w:"Plus de 130 ans après sa mort, son nom est prononcé des millions de fois par jour. Mais demande autour de toi : beaucoup ne savent même pas que c’était un homme. On se souviendra du nom, pas de la personne."},
 {n:"Walt Disney", d:"Créateur de Mickey", v:2, w:"Son nom est sur l’une des marques les plus puissantes du monde. Mais les marques aussi finissent par mourir. Je dis 300 ans, et plus si Disney existe encore en 2300."},
 {n:"Johnny Hallyday", d:"Le rockeur français", v:1, w:"Des centaines de milliers de personnes sur les Champs-Élysées en 2017. Mais sa gloire est très française et très générationnelle. Dans 100 ans, il sera ce que Maurice Chevalier est pour nous."},
 {n:"Édith Piaf", d:"Chanteuse de La Vie en rose", v:2, w:"La Vie en rose est connue jusqu’au Japon et aux États-Unis. Pour le monde entier, elle est « la chanson française », ce qui la protège bien mieux que Johnny."},
 {n:"Nabilla", d:"« Allô ! Non mais allô, quoi »", v:0, w:"La phrase survivra peut-être plus longtemps qu’elle. C’est souvent le cas : on cite des répliques dont on a oublié l’auteur."},
 {n:"Mark Zuckerberg", d:"Fondateur de Facebook", v:1, w:"Un film lui est consacré, ça aide. Mais qui connaît le fondateur de MySpace ? Si Facebook disparaît un jour comme MySpace, il suivra."},
 {n:"Alan Turing", d:"Mathématicien, père de l’informatique", v:4, w:"Machine de Turing, test de Turing : il est dans tous les cours d’informatique. Plus l’IA prendra de place, plus on remontera jusqu’à lui. Il sera l’Euclide de l’ère numérique."},
 {n:"Tim Berners-Lee", d:"Inventeur du Web (1989)", v:1, w:"Il a inventé le Web et, même aujourd’hui, presque personne ne connaît son nom. Changer le monde ne suffit pas pour rester célèbre. Il restera dans les livres d’histoire de l’informatique, pas dans les conversations."},
 {n:"Satoshi Nakamoto", d:"Créateur anonyme du bitcoin", v:2, w:"Le mystère fabrique les légendes. Personne ne sait qui c’est, et c’est précisément ce qui le rend fascinant. Si le bitcoin survit, son créateur fantôme deviendra un mythe moderne."},
 {n:"Pablo Picasso", d:"Peintre, Guernica", v:3, w:"Il est le peintre du XXe siècle comme Michel-Ange est celui du XVIe. Michel-Ange tient depuis 500 ans, Picasso est bien parti pour en faire autant."},
 {n:"Charlie Chaplin", d:"Charlot, star du cinéma muet", v:2, w:"Le premier acteur connu dans le monde entier. Le cinéma muet est loin, mais la silhouette de Charlot est devenue le symbole du cinéma lui-même."},
 {n:"Elvis Presley", d:"Le King du rock", v:2, w:"Le rock deviendra un genre ancien, comme le baroque, et on se souviendra de ses fondateurs. Elvis est le visage du rock comme Louis XIV est celui de Versailles."},
 {n:"Elizabeth II", d:"Reine du Royaume-Uni de 1952 à 2022", v:3, w:"70 ans de règne, un record britannique. La reine Victoria a donné son nom à une époque entière, l’ère victorienne. Elizabeth II est bien partie pour le même destin."},
 {n:"J. K. Rowling", d:"Autrice de Harry Potter", v:2, w:"Lewis Carroll est encore connu 160 ans après Alice au pays des merveilles. Harry Potter a tout d’un classique pour enfants. Mais on retiendra Harry plus longtemps que son autrice."},
 {n:"J. R. R. Tolkien", d:"Auteur du Seigneur des anneaux", v:3, w:"Il a inventé un monde entier, des langues, et le genre fantasy moderne. Homère a inventé l’épopée il y a 2 800 ans ; Tolkien peut viser 500 ans sans trembler."},
 {n:"Usain Bolt", d:"Sprinteur, 9,58 s au 100 m", v:1, w:"Le jour où son record tombera, il deviendra un ancien recordman parmi d’autres. Jesse Owens est encore connu 90 ans après, mais parce qu’il a gagné les JO de Berlin sous les yeux de Hitler. Bolt n’a pas cette dimension historique."},
 {n:"Mohamed Ali", d:"Boxeur, champion du monde", v:2, w:"L’exception chez les sportifs : il a dépassé le sport en refusant la guerre du Vietnam et en s’engageant pour les droits civiques. Il sera dans les livres d’histoire, pas seulement dans ceux de sport."},
 {n:"Michael Jordan", d:"Légende du basket", v:1, w:"Son nom survivra plus longtemps sur des baskets que dans les mémoires. Dans 300 ans, on achètera peut-être encore des Jordan sans savoir qui c’était."},
 {n:"Freddie Mercury", d:"Chanteur de Queen", v:1, w:"Bohemian Rhapsody passe encore partout et un film lui a été consacré. Il tiendra un siècle, mais à long terme, les chanteurs s’effacent derrière le nom du groupe."},
 {n:"Cléopâtre", d:"Reine d’Égypte (69-30 av. J.-C.)", v:4, w:"Déjà plus de 2 000 ans. Elle prouve qu’une légende entretenue par les pièces de théâtre et les films peut traverser les millénaires."},
 {n:"Greta Thunberg", d:"Militante pour le climat", v:1, w:"Si le climat devient le sujet du siècle, elle en sera un symbole, comme Rosa Parks pour les droits civiques. Mais les visages d’un mouvement sont souvent remplacés par d’autres plus tard."},
 {n:"Inoxtag", d:"Youtubeur qui a gravi l’Everest", v:0, w:"Des milliers de personnes ont gravi l’Everest. Même le premier, Edmund Hillary, est peu connu aujourd’hui. Inoxtag a marqué une génération, pas l’histoire."},
 {n:"Bernard Arnault", d:"Patron de LVMH", v:0, w:"Les grands patrons s’effacent derrière leurs marques. Dans 100 ans, Louis Vuitton et Dior seront encore là ; lui, beaucoup moins dans les mémoires."},
 {n:"Molière", d:"Dramaturge (1622-1673)", v:4, w:"Le français s’appelle « la langue de Molière ». Quand une langue entière porte ton nom, tu es tranquille pour 1 000 ans."},
 {n:"Victor Hugo", d:"Les Misérables, Notre-Dame de Paris", v:3, w:"Les Misérables est l’une des comédies musicales les plus jouées au monde, et Disney a adapté Notre-Dame de Paris. Il est le Shakespeare français."},
 {n:"Stephen Hawking", d:"Physicien, spécialiste des trous noirs", v:2, w:"Son nom restera attaché au « rayonnement de Hawking » dans les manuels de physique. Comme Doppler : tout le monde connaît l’effet, plus personne ne connaît l’homme."},
 {n:"Lady Diana", d:"Princesse de Galles (1961-1997)", v:1, w:"Sissi est encore connue plus d’un siècle après grâce aux films. Diana a eu The Crown. Je dis 100 ans."},
 {n:"Sam Altman", d:"Patron d’OpenAI, ChatGPT", v:1, w:"Si ChatGPT reste comme le début de l’ère de l’IA, il sera cité parmi les pionniers. Mais à long terme, on retient les inventeurs mieux que les patrons."},
 {n:"Antoine Dupont", d:"Demi de mêlée du Stade Toulousain et du XV de France", v:0, w:"Même règle que pour les footballeurs : les sportifs ne traversent pas les siècles. Qui connaît encore Jean Prat, la légende du XV de France des années 1950 ? Les supporters toulousains vont me détester, mais dans 100 ans, ce sera un nom dans les livres de rugby."},
 {n:"Léon Marchand", d:"Nageur toulousain, 4 titres olympiques à Paris 2024", v:0, w:"Quatre médailles d’or à domicile, c’est immense. Mais Michael Phelps en a 23 et il sera déjà flou dans un siècle. En natation, les records tombent tous les dix ans."},
 {n:"Teddy Riner", d:"Judoka, 5 titres olympiques", v:0, w:"Le plus grand judoka de l’histoire, sans débat. Mais le judo n’a pas la place du foot dans les mémoires, et les champions s’effacent encore plus vite dans les sports moins médiatisés."},
 {n:"Pelé", d:"Footballeur brésilien, 3 Coupes du monde", v:1, w:"La seule exception possible chez les sportifs : c’est lui qui a fait du foot un spectacle mondial, à l’arrivée de la télévision. Plus de 50 ans après sa dernière Coupe du monde, tout le monde connaît encore son nom. Je lui donne un siècle."},
 {n:"Diego Maradona", d:"Champion du monde 1986, la « main de Dieu »", v:1, w:"Un but de la main et le but du siècle dans le même match, contre l’Angleterre. Les légendes tiennent mieux quand elles ont un scandale. Un siècle, pas plus."},
 {n:"Roger Federer", d:"Joueur de tennis suisse, 20 titres du Grand Chelem", v:0, w:"Djokovic a déjà fait mieux au nombre de titres. Dans un sport où les records tombent, l’élégance ne suffit pas à rester dans les mémoires."},
 {n:"Jeanne d’Arc", d:"Héroïne de la guerre de Cent Ans (vers 1412-1431)", v:4, w:"Près de 600 ans après sa mort, elle a des statues dans toute la France, des films et des rues partout. Morte à 19 ans sur un bûcher : son histoire est faite pour être racontée encore et encore."},
 {n:"William Shakespeare", d:"Dramaturge anglais (1564-1616)", v:4, w:"400 ans après, on joue Roméo et Juliette tous les jours quelque part dans le monde, et on lui attribue des centaines de mots anglais. Avec Homère, c’est l’auteur dont on peut parier qu’il sera encore lu en l’an 3000."},
 {n:"Beyoncé", d:"Chanteuse américaine, record de Grammy Awards", v:1, w:"L’artiste la plus récompensée de l’histoire des Grammy Awards. Mais les trophées ne font pas l’éternité : les records de récompenses finissent toujours par être battus et oubliés."},
 {n:"Louis de Funès", d:"Acteur, Le Corniaud, La Grande Vadrouille", v:1, w:"Plus de 40 ans après sa mort, ses films repassent encore à la télé et font rire les enfants. Le comique de grimaces traverse les générations mieux que les dialogues. Mais hors de France, presque personne ne le connaît."},
 {n:"Vincent van Gogh", d:"Peintre des Tournesols et de La Nuit étoilée", v:4, w:"Il n’a presque rien vendu de son vivant, et il est aujourd’hui l’un des peintres les plus célèbres du monde. Sa vie, son oreille coupée et ses couleurs en font un mythe complet."},
 {n:"Charles Darwin", d:"Naturaliste, théorie de l’évolution", v:4, w:"Expliquer d’où vient toute la vie sur Terre, ça ne s’oublie pas. Son nom est même devenu un adjectif : on parle de sélection « darwinienne ». 1 000 ans sans problème."},
 {n:"Isaac Newton", d:"Physicien, la pomme et la gravitation", v:4, w:"Une unité de mesure à son nom, le newton, et la pomme la plus célèbre de l’histoire des sciences. Dans 1 000 ans, on apprendra encore ses lois au lycée."},
 {n:"Nikola Tesla", d:"Inventeur, pionnier de l’électricité", v:4, w:"Double assurance : une unité de mesure à son nom, le tesla, et une marque de voitures connue dans le monde entier. Même si la marque disparaît, l’unité restera."},
 {n:"Thomas Edison", d:"Inventeur américain, l’ampoule électrique", v:3, w:"Il n’a pas inventé l’ampoule, il l’a rendue fiable et vendable. Mais la légende a gagné : pour tout le monde, c’est lui. Les légendes simples survivent longtemps."},
 {n:"Jules Verne", d:"Vingt Mille Lieues sous les mers, Le Tour du monde en 80 jours", v:3, w:"L’un des auteurs les plus traduits au monde, 150 ans après ses grands romans. Il a imaginé le sous-marin moderne et le voyage vers la Lune : chaque fois qu’une de ses idées se réalise, on reparle de lui."},

/* Le Grand Débat : x = camp A, y = camp B, ax / ay = arguments de secours, m = mon avis, p = pimenté */
const DEBAT = [
 {q:"Chocolatine ou pain au chocolat ?", x:"Chocolatine", y:"Pain au chocolat",
  ax:["Vous partez de Toulouse : dans le Sud-Ouest, on dit chocolatine, point final.","Ce n’est pas du pain, c’est une viennoiserie. « Pain au chocolat » est donc faux.","Au Québec aussi, on dit chocolatine. Le Sud-Ouest n’est pas seul au monde."],
  ay:["C’est le mot utilisé dans la plus grande partie de la France.","On dit pain aux raisins, pas raisinine. La logique est de notre côté.","Le mot dit exactement ce qu’il y a dedans. Pas besoin de traduction."],
  m:"Chocolatine, sans hésiter. Ce n’est pas du pain, et le mot a un vrai ancrage régional. Mais j’admets que le camp d’en face a la majorité de la France avec lui, et en démocratie, ça compte."},
 {q:"Le rugby est-il un plus beau sport que le football ?", x:"Oui, le rugby", y:"Non, le football",
  ax:["Au rugby, on ne conteste pas l’arbitre, on l’appelle « monsieur ».","On se plaque pendant 80 minutes, puis on boit un verre ensemble : c’est la troisième mi-temps.","Il y a de la place pour tous les gabarits, du petit demi de mêlée au pilier de 130 kilos."],
  ay:["C’est le sport le plus populaire du monde : un ballon et deux sacs suffisent pour jouer.","Un match de foot se comprend en dix secondes. Les règles du rugby, même les joueurs les débattent.","Un seul but peut tout changer jusqu’à la dernière seconde."],
  m:"Pour une voiture qui part de Toulouse, la réponse est évidente : le rugby. Plus sérieusement, le rugby gagne sur le respect de l’arbitre et l’esprit, le foot sur la simplicité et l’universalité. Pour le spectacle pur, je penche pour le rugby."},
 {q:"Toulouse ou Clermont-Ferrand : quelle ville est la plus agréable à vivre ?", x:"Toulouse", y:"Clermont-Ferrand",
  ax:["Plus de 2 000 heures de soleil par an, et la brique rose qui brille au coucher du soleil.","Airbus, le spatial, une énorme ville étudiante : c’est là qu’il y a du travail.","Le Stade Toulousain, le club le plus titré de France."],
  ay:["Les volcans sont à 20 minutes du centre-ville, et la chaîne des Puys est classée à l’Unesco.","Les loyers et l’immobilier y coûtent nettement moins cher qu’à Toulouse.","Moins de bouchons, et les pistes de ski à environ une heure de route."],
  m:"Pour l’emploi et le soleil, Toulouse gagne. Pour le prix de l’immobilier et la nature, Clermont gagne largement. Avec un salaire moyen, je choisirais Clermont : on y vit mieux pour le même budget. Mais je ne le dirais pas trop fort en sortant de Toulouse."},
 {q:"Louer ou acheter sa résidence principale ?", x:"Louer", y:"Acheter",
  ax:["Les frais de notaire dans l’ancien, environ 7 à 8 % du prix, sont perdus le jour de l’achat.","Locataire, on peut déménager pour un meilleur travail sans être bloqué par un bien à vendre.","L’apport placé ailleurs peut rapporter, pendant que le propriétaire paie des intérêts et la taxe foncière."],
  ay:["Un loyer part pour toujours. Une mensualité de crédit, c’est en grande partie de l’épargne.","Le crédit permet d’acheter avec l’argent de la banque : peu de placements se financent aussi facilement.","À la retraite, le propriétaire n’a plus de loyer à payer."],
  m:"Tout dépend de la durée. En dessous de 5 à 7 ans, louer gagne souvent à cause des frais d’achat et de revente. Au-delà, acheter l’emporte en général, surtout avec un crédit à taux fixe. Pour le reste, il y a un conseiller en gestion de patrimoine dans la voiture."},
 {q:"Ton meilleur ami se fait tromper. Faut-il le lui dire ?", x:"Oui, il faut le lui dire", y:"Non, ce n’est pas ton rôle", p:1,
  ax:["Un vrai ami dit la vérité, même quand elle fait mal.","S’il apprend un jour que tu savais, c’est votre amitié qui est finie.","Plus il l’apprend tard, plus il perd de temps dans une relation fausse."],
  ay:["Vu de l’extérieur, on ne connaît jamais toute l’histoire d’un couple.","Le messager se fait souvent détester, et le couple se réconcilie contre lui.","Le mieux est de pousser l’autre personne à avouer elle-même."],
  m:"Je le dirais, mais seulement avec une certitude, pas sur une rumeur. En tête à tête, sans détails inutiles. Le silence protège surtout celui qui sait, pas celui qui est trompé."},
 {q:"Peut-on rester ami avec son ex ?", x:"Oui", y:"Non", p:1,
  ax:["Si on s’est aimés, c’est qu’on s’entendait bien. Pourquoi tout jeter ?","Avec le temps, les sentiments passent et l’amitié reste.","Quand on a des amis en commun, c’est plus simple pour tout le monde."],
  ay:["L’un des deux espère toujours un peu plus que de l’amitié.","Le ou la suivante ne sera jamais à l’aise.","Pour tourner la page, il faut fermer le livre."],
  m:"Possible, mais rarement tout de suite. Il faut une vraie coupure de quelques mois, et que les deux soient passés à autre chose. Sans ça, ce n’est pas de l’amitié, c’est une salle d’attente."},
 {q:"Au restaurant entre amis, faut-il partager l’addition à parts égales ?", x:"Oui, parts égales", y:"Non, chacun paie sa part",
  ax:["On est entre amis, pas chez le comptable.","Ça va plus vite : personne ne passe dix minutes sur la calculatrice.","La prochaine fois, c’est toi qui prendras le plat le plus cher. Ça s’équilibre."],
  ay:["Celui qui a pris une salade n’a pas à payer le homard du voisin.","Ceux qui ont moins de moyens peuvent venir sans stress.","Avec les applis de paiement, faire les comptes prend trente secondes."],
  m:"Parts égales, sauf grosse différence. Si quelqu’un a pris une salade et de l’eau pendant que les autres commandaient du vin, on le laisse payer sa part. L’amitié vaut plus que 6 euros, mais pas forcément plus que 40."},
 {q:"En voiture, qui choisit la musique ?", x:"Le conducteur", y:"Le passager avant",
  ax:["C’est lui qui travaille : il a droit à son ambiance.","Une musique qu’il n’aime pas le fatigue, et un conducteur fatigué, c’est dangereux.","Sa voiture, ses règles."],
  ay:["Le conducteur doit regarder la route, pas son téléphone.","Le passager avant est le copilote : la musique fait partie du poste.","Le conducteur a déjà le volant. On ne peut pas tout avoir."],
  m:"Le passager avant choisit, mais le conducteur garde un droit de veto. C’est la règle la plus sûre : personne ne touche à son téléphone au volant, et personne ne subit quatre heures de musique qu’il déteste."},
 {q:"Les vacances : mer ou montagne ?", x:"La mer", y:"La montagne",
  ax:["Ne rien faire sur une plage, c’est le seul vrai repos.","Les fruits de mer, les couchers de soleil sur l’eau, les apéros les pieds dans le sable.","À la montagne aussi on se baigne, mais dans un lac à 14 degrés."],
  ay:["La montagne se vit toute l’année : ski l’hiver, randonnée l’été.","Moins de monde, plus d’air frais, pas de serviettes collées les unes aux autres.","Pas de sable dans la voiture au retour."],
  m:"La montagne. Elle offre deux saisons au lieu d’une et beaucoup moins de foule. Et vous allez en Auvergne : montrez-lui un peu de respect."},
 {q:"Faut-il dépenser tout son argent de son vivant plutôt que de le laisser en héritage ?", x:"Oui, tout dépenser", y:"Non, transmettre",
  ax:["En France, on hérite en moyenne vers 50 ans, quand on en a le moins besoin.","On travaille toute sa vie pour en profiter, pas pour les droits de succession.","Mieux vaut donner de son vivant et voir le plaisir que ça fait."],
  ay:["Transmettre, c’est donner à ses enfants un meilleur départ que le sien.","Personne ne connaît la date de sa mort. Tout dépenser, c’est risquer de finir sans rien.","Un patrimoine construit sur plusieurs générations, ça ne se rattrape pas."],
  m:"Entre les deux : donner de son vivant. Chaque parent peut donner 100 000 euros à chaque enfant tous les 15 ans sans droits de donation. On profite de son argent, on voit ses enfants en profiter, et on paie moins d’impôts. Le conseiller de la voiture approuvera."},
 {q:"Les chiens sont-ils meilleurs que les chats ?", x:"Oui, les chiens", y:"Non, les chats",
  ax:["Un chien est fou de joie de te revoir, même si tu es parti cinq minutes.","Un chien te fait sortir et bouger tous les jours.","On peut apprendre des dizaines de choses à un chien. Essaie avec un chat."],
  ay:["Un chat se garde tout seul un week-end. Un chien, non.","Le chat t’aime, mais il te choisit. C’est plus flatteur.","Un chat ne réveille pas les voisins en aboyant à 6 heures."],
  m:"Je suis une IA, je n’ai pas de canapé à protéger. Mais pour une vie active avec beaucoup de déplacements, le chat est plus simple. Pour la compagnie pure, le chien gagne."},
 {q:"Les films : en VF ou en VO ?", x:"En VF", y:"En VO",
  ax:["On regarde le film au lieu de lire des sous-titres.","Les comédiens de doublage français sont parmi les meilleurs du monde.","Certaines répliques cultes n’existent vraiment qu’en VF."],
  ay:["La voix de l’acteur fait partie de son jeu. La changer, c’est changer le film.","On progresse en anglais sans effort.","Les blagues et les jeux de mots se perdent souvent à la traduction."],
  m:"La VO, quand les sous-titres ne gênent pas : la voix fait partie du jeu d’un acteur. Mais pour les dessins animés, la VF est souvent une vraie création, et elle se défend très bien."},
 {q:"L’argent fait-il le bonheur ?", x:"Oui", y:"Non",
  ax:["Ceux qui disent non n’ont jamais eu de problèmes d’argent.","L’argent achète du temps, de la santé et de la liberté.","Des études récentes montrent que le bien-être continue d’augmenter avec les revenus."],
  ay:["Plein de gens très riches sont malheureux, et plein de gens modestes sont heureux.","L’amour, l’amitié et la santé ne s’achètent pas.","Plus on gagne, plus on dépense, et plus on en veut."],
  m:"Il en faut assez pour ne plus y penser. En dessous, il fait clairement le bonheur. Au-dessus, il en fait toujours un peu plus, mais de moins en moins. Après, ce sont les gens autour de toi qui font la différence."},
 {q:"Mieux vaut être patron d’une petite boîte ou cadre dans une grande ?", x:"Patron d’une petite boîte", y:"Cadre dans une grande",
  ax:["On ne travaille pour personne d’autre que soi.","Ce qu’on construit nous appartient, et ça peut se revendre.","Pas de réunion pour préparer la réunion."],
  ay:["Un salaire qui tombe tous les mois, même quand l’économie va mal.","Des congés vraiment déconnectés : quand on part, quelqu’un prend le relais.","Chômage, mutuelle, CSE : un filet de sécurité complet."],
  m:"Patron, à condition d’aimer le risque. On travaille plus, on dort parfois moins, mais on construit un patrimoine qui nous appartient. Ceux qui ont essayé en parleront mieux que moi."},
 {q:"Le télétravail : progrès ou piège ?", x:"Un progrès", y:"Un piège",
  ax:["Pas de trajet : des heures gagnées chaque semaine.","On travaille mieux au calme qu’en open space.","On peut vivre loin des grandes villes, là où le logement coûte moins cher."],
  ay:["On ne sait plus quand la journée de travail s’arrête.","On apprend moins vite seul derrière un écran, surtout en début de carrière.","Les promotions vont souvent à ceux qu’on voit au bureau."],
  m:"Un progrès, à petite dose. Deux ou trois jours par semaine, c’est presque le meilleur des deux mondes. À 100 %, c’est un piège, surtout pour les jeunes qui apprennent le métier."},
 {q:"Faut-il faire croire au Père Noël aux enfants ?", x:"Oui", y:"Non",
  ax:["C’est la magie de l’enfance, et elle passe bien assez vite.","Presque tous les adultes en gardent un bon souvenir.","Les enfants découvrent la vérité seuls, au bon moment pour eux."],
  ay:["On apprend aux enfants à ne pas mentir, puis on leur ment pendant des années.","La magie de Noël existe aussi sans personnage inventé.","Certains enfants le vivent mal quand ils l’apprennent."],
  m:"Oui. C’est un jeu plus qu’un mensonge, et la plupart des enfants le comprennent seuls en grandissant. Le jour où l’enfant pose la question sérieusement, on lui répond sérieusement."},
 {q:"Les réseaux sociaux ont-ils rendu nos vies meilleures ?", x:"Oui", y:"Non",
  ax:["On garde contact avec des gens qu’on aurait perdus de vue.","N’importe qui peut lancer son entreprise ou sa carrière depuis sa chambre.","On apprend à cuisiner, bricoler ou investir gratuitement."],
  ay:["On passe des heures par jour à faire défiler des vidéos.","On compare sa vie à celle des autres, toujours en version retouchée.","Les fausses informations circulent plus vite que les vraies."],
  m:"Pour garder contact et apprendre, oui. Pour notre attention et notre moral, non. Le problème n’est pas l’outil, c’est le fil infini conçu pour qu’on ne s’arrête jamais. Mon verdict : légèrement négatif."},
 {q:"Dans un couple, doit-on avoir accès au téléphone de l’autre ?", x:"Oui", y:"Non", p:1,
  ax:["Si on n’a rien à cacher, pourquoi le cacher ?","La transparence évite les doutes et les disputes.","En cas d’urgence, c’est pratique de pouvoir l’ouvrir."],
  ay:["Avoir confiance, c’est justement ne pas avoir besoin de vérifier.","Le téléphone contient aussi les secrets des amis, qui ne nous appartiennent pas.","Chacun a droit à son jardin secret, même en couple."],
  m:"Non. Connaître le code en cas d’urgence, pourquoi pas. Mais fouiller ou exiger l’accès, c’est déjà le signe d’un problème de confiance, et le téléphone ne le réglera pas."},
 {q:"Cassoulet ou aligot : quel est le meilleur plat ?", x:"Le cassoulet", y:"L’aligot",
  ax:["Haricots, confit, saucisse de Toulouse : un repas complet dans un seul plat.","Il est encore meilleur réchauffé le lendemain.","Castelnaudary, Carcassonne et Toulouse se le disputent depuis des siècles : c’est bien qu’il le vaut."],
  ay:["Purée, tomme fraîche et ail : trois ingrédients et du génie.","Le spectacle du fromage qui file au bout de la cuillère.","C’est le plat de l’Aubrac, entre l’Aveyron, la Lozère et le Cantal : le trajet en est presque un pèlerinage."],
  m:"Le cassoulet, pour la richesse. Mais l’aligot est le seul plat qui se mange en faisant de la musculation avec sa cuillère. Idéalement : un cassoulet ce soir, un aligot demain."},
 {q:"Pour voyager en France, mieux vaut la voiture ou le train ?", x:"La voiture", y:"Le train",
  ax:["À quatre, le prix par personne bat presque toujours le train.","On part quand on veut, avec autant de bagages qu’on veut.","Les meilleurs moments se passent dans la voiture. La preuve : cette appli."],
  ay:["On peut dormir, lire ou travailler pendant le trajet.","Pas de bouchons, pas de fatigue au volant.","Le train émet beaucoup moins de CO2 par voyageur que la voiture."],
  m:"À quatre amis, la voiture gagne : le prix, la liberté, et cette appli. Seul, le train gagne largement."},
 {q:"Vaut-il mieux être très intelligent ou très beau ?", x:"Très intelligent", y:"Très beau",
  ax:["La beauté passe avec l’âge, l’intelligence reste.","L’intelligence permet de gagner de l’argent, et l’argent permet… tout le reste.","On peut toujours s’arranger physiquement, beaucoup moins intellectuellement."],
  ay:["Des études montrent que les gens beaux sont en moyenne mieux payés.","La beauté ouvre les portes dès le premier regard, sans effort.","Les gens très intelligents s’inquiètent de tout. Les gens beaux profitent."],
  m:"Intelligent. La beauté donne un avantage au début d’une rencontre, l’intelligence pendant toute la vie. Et à 80 ans, c’est la seule des deux qui se voit encore."},
 {q:"Faut-il se marier, ou au moins se pacser, avant d’acheter un bien à deux ?", x:"Oui, d’abord se protéger", y:"Non, c’est trop tôt",
  ax:["Entre concubins, ce qu’on lègue par testament est taxé à 60 %.","Sans mariage ni Pacs, le survivant n’hérite de rien sans testament.","Le Pacs se signe vite et se défait facilement."],
  ay:["On ne s’engage pas pour la vie juste pour une question de notaire.","Un achat en indivision bien rédigé chez le notaire protège déjà chacun selon son apport.","L’amour ne se règle pas avec des papiers."],
  m:"Oui, au moins un Pacs et un testament, et ce n’est pas une blague. Entre concubins, ce qui est transmis par testament est taxé à 60 %. Entre époux ou partenaires de Pacs, c’est exonéré. Attention : un partenaire de Pacs n’hérite que s’il y a un testament."},
 {q:"L’intelligence artificielle va-t-elle supprimer plus d’emplois qu’elle n’en crée ?", x:"Oui", y:"Non",
  ax:["Elle sait déjà écrire, traduire, coder et dessiner. Que restera-t-il ?","Cette fois, la machine remplace le cerveau, pas seulement les bras.","Les nouveaux métiers créés demanderont beaucoup moins de monde."],
  ay:["Chaque révolution technique a fait peur, et l’emploi a toujours fini par augmenter.","Le métier de développeur web n’existait pas il y a 30 ans.","L’IA aide surtout à faire son travail plus vite, pas à le faire disparaître."],
  m:"Je suis mal placé pour être neutre. Honnêtement, personne ne le sait. Les révolutions passées ont fini par créer plus d’emplois, mais la transition a été dure pour ceux qui l’ont vécue. Ce qui est sûr : les métiers vont changer plus vite que les formations."},
 {q:"Faut-il interdire les téléphones à table ?", x:"Oui", y:"Non",
  ax:["Un repas, c’est le seul moment où on se parle vraiment.","Regarder son écran pendant que quelqu’un parle, c’est lui dire qu’il compte moins.","Le premier qui regarde son téléphone paie l’addition : problème réglé."],
  ay:["Vérifier une info en direct règle les débats en dix secondes.","Montrer une photo ou une vidéo, ça fait partie de la conversation.","On n’est plus au collège : chacun est assez grand pour se gérer."],
  m:"Oui, sauf exception. Le téléphone posé écran contre la table, et on ne le sort que pour vérifier une info ou montrer une photo au groupe. Le jeu de la pile de téléphones, où le premier qui craque paie, marche très bien."},
 {q:"Les Français râlent-ils trop ?", x:"Oui", y:"Non",
  ax:["On râle contre la météo, les impôts, les grèves, et même contre ceux qui râlent.","Les étrangers le disent tous : c’est notre sport national.","On a des vacances et une protection sociale enviées partout, et on se plaint quand même."],
  ay:["Râler, c’est l’esprit critique. C’est ce qui fait avancer les choses.","La France reste le pays le plus visité du monde. Si c’était si terrible, ça se saurait.","Râler ensemble crée du lien. C’est presque une forme d’amitié."],
  m:"Oui, mais c’est une qualité déguisée : râler, c’est refuser de se contenter. Le vrai problème commence quand on râle sans jamais rien changer."},
 {q:"Le pire passager : celui qui dort tout le trajet ou celui qui parle sans arrêt ?", x:"Celui qui dort", y:"Celui qui parle",
  ax:["Il ne participe à rien : ni à la conversation, ni à la musique, ni à l’essence.","Il donne envie de dormir au conducteur, et ça, c’est dangereux.","Il se réveille à l’arrivée en disant que le trajet est passé vite."],
  ay:["Le dormeur, au moins, ne dérange personne.","Quatre heures de monologue, ça fatigue plus que la route.","Le bavard empêche le conducteur de se concentrer."],
  m:"Celui qui dort. Le bavard garde le conducteur éveillé, et c’est le vrai rôle d’un passager sur un long trajet. Si quelqu’un s’endort aujourd’hui, vous savez qui a perdu ce débat."}

 {t:["Après 1066, le français a été la langue de la cour d’Angleterre pendant environ trois siècles.","La devise de la monarchie britannique est en français : « Dieu et mon droit »."], f:"Le mot « week-end » vient du français.", w:"C’est un mot anglais, adopté en France au début du XXe siècle. Ironie de l’histoire : l’anglais, lui, a emprunté des milliers de mots au français après 1066."},

 {t:["La chaîne des Puys est inscrite au patrimoine mondial de l’Unesco.","Michelin a été fondé à Clermont-Ferrand."], f:"Clermont-Ferrand est la ville la plus haute de France.", w:"La plus haute ville de France est Briançon, à plus de 1 300 mètres. Clermont est autour de 400 mètres : ce sont les volcans qui la dominent, pas la ville."},
 {t:["L’ancêtre du croissant, le kipferl, vient d’Autriche.","Le roquefort a été le premier fromage protégé par une appellation d’origine en France."], f:"Le champagne a été inventé par le moine Dom Pérignon.", w:"C’est une légende entretenue par le marketing. Des Anglais décrivaient déjà comment rendre le vin pétillant en 1662, et Dom Pérignon cherchait plutôt à éviter les bulles. Le roquefort, lui, est protégé par une loi de 1925."},
 {t:["Un éclair est plus chaud que la surface du Soleil.","Le son va plus vite dans l’eau que dans l’air."], f:"La foudre ne tombe jamais deux fois au même endroit.", w:"Elle adore retomber au même endroit : l’Empire State Building est frappé une vingtaine de fois par an. Et un éclair atteint environ 30 000 °C, cinq fois plus que la surface du Soleil."},
 {t:["Le Monopoly descend d’un jeu créé pour dénoncer les excès des propriétaires.","Le Rubik’s Cube a été inventé par un professeur d’architecture hongrois."], f:"Les échecs ont été inventés en France au Moyen Âge.", w:"Les échecs viennent d’Inde, vers le VIe siècle, et sont passés par la Perse avant d’arriver en Europe. Le Monopoly, lui, descend de The Landlord’s Game, créé en 1904 par Lizzie Magie pour montrer les dangers de l’accaparement des terres."},
 {t:["Les tomates ont longtemps été considérées comme toxiques en Europe.","Botaniquement, la banane est une baie, mais pas la fraise."], f:"Le chocolat blanc contient plus de cacao que le chocolat noir.", w:"Le chocolat blanc ne contient aucune poudre de cacao, seulement du beurre de cacao, du sucre et du lait. Le chocolat noir en contient souvent plus de 50 %."},

 {t:["Les billets en euros ne représentent aucun monument réel.","Une pièce de 1 centime coûte plus cher à fabriquer qu’elle ne vaut."], f:"Le livret A a été créé en 1945 pour financer la reconstruction.", w:"Il date de 1818, juste après les guerres napoléoniennes : il a plus de 200 ans. Les billets en euros, eux, montrent des styles d’architecture imaginaires, pour ne favoriser aucun pays."},

 {t:["En 1914, des taxis parisiens ont transporté des soldats vers le front de la Marne.","La guerre de Cent Ans a duré 116 ans."], f:"Les gladiateurs saluaient l’empereur par « Ave Caesar, morituri te salutant » avant chaque combat.", w:"La phrase n’est attestée qu’une seule fois, lors d’une bataille navale organisée sous l’empereur Claude, par des condamnés et non des gladiateurs ordinaires. C’est le cinéma qui en a fait une habitude."},
 {t:["La France est le pays qui compte le plus de fuseaux horaires au monde.","Le Brésil a une frontière avec la France."], f:"Le Sahara est le plus grand désert du monde.", w:"Le plus grand désert est l’Antarctique : un désert se définit par le manque de pluie, pas par la chaleur. Le Sahara est seulement le plus grand désert chaud. La France, avec l’outre-mer, compte 12 fuseaux horaires."},
 {t:["L’Australie est plus large que la Lune.","Il fait plus chaud sur Vénus que sur Mercure, pourtant plus proche du Soleil."], f:"Dans l’espace, on entend les explosions.", w:"Le son a besoin d’air ou de matière pour se propager. Dans le vide, une explosion est totalement silencieuse, n’en déplaise à Star Wars. L’Australie mesure environ 4 000 km d’est en ouest, la Lune 3 474 km de diamètre."},
 {t:["Le premier iPhone n’avait pas d’App Store.","Le premier SMS de l’histoire disait « Merry Christmas »."], f:"Le premier ordinateur portable d’Apple s’appelait le MacBook.", w:"C’était le Macintosh Portable, en 1989, qui pesait plus de 7 kilos. Le nom MacBook n’est arrivé qu’en 2006. Et l’App Store est sorti en 2008, un an après le premier iPhone."},
 {t:["La Vache qui rit a été créée dans le Jura.","Le cantal fait partie des plus anciens fromages de France."], f:"Le cassoulet est protégé par une appellation d’origine contrôlée.", w:"Aucune AOC pour le cassoulet, malgré les débats enflammés entre Castelnaudary, Carcassonne et Toulouse. Le cantal, lui, est une AOP, et des textes antiques évoquent déjà les fromages de la région."},
 {t:["Le dessin de Rose dans Titanic a été fait par James Cameron lui-même.","Toy Story est le premier long métrage entièrement en images de synthèse."], f:"Dans Star Wars, Dark Vador dit « Luke, je suis ton père ».", w:"Il dit en réalité « Non, je suis ton père ». Le prénom Luke n’y est pas. Tout le monde cite la mauvaise version : c’est l’un des faux souvenirs collectifs les plus connus."},

/* Bingo : grille de 16 cases, lignes, colonnes et diagonales */
const LINES = (() => { const L = [];
  for (let r = 0; r < 4; r++) L.push([0, 1, 2, 3].map(c => r * 4 + c));
  for (let c = 0; c < 4; c++) L.push([0, 1, 2, 3].map(r => r * 4 + c));
  L.push([0, 5, 10, 15], [3, 6, 9, 12]); return L; })();
function ensureBingo(){
  const B = S.bingo;
  if (!B || !Array.isArray(B.cells) || B.cells.length !== 16) S.bingo = {cells: shuffle(BINGO).slice(0, 16), found:{}, lines:{}, full:null};
  return S.bingo;
}
function addPts(pid, n){ const p = S.players[pIndex(pid)]; if (p) p.score += n; }
function spot(i, pid){
  const B = S.bingo; if (B.found[i] && pIndex(B.found[i]) >= 0) return;
  B.found[i] = pid; addPts(pid, 1);
  const name = S.players[pIndex(pid)].name; let msg = "";
  LINES.forEach((L, li) => { if (L.includes(i) && !B.lines[li] && L.every(x => B.found[x])){ B.lines[li] = pid; addPts(pid, 3); msg = "Ligne pour " + name + " : +3 !"; } });
  if (!B.full && Object.keys(B.found).length === 16){ B.full = pid; addPts(pid, 5); msg = "Carton plein pour " + name + " : +5 !"; }
  if (msg) toast(msg);
}
function unspot(i){
  const B = S.bingo, pid = B.found[i]; if (!pid) return;
  delete B.found[i]; addPts(pid, -1);
  LINES.forEach((L, li) => { if (L.includes(i) && B.lines[li]){ addPts(B.lines[li], -3); delete B.lines[li]; } });
  if (B.full){ addPts(B.full, -5); B.full = null; }
}

/* Minuteur du Grand Débat : basé sur l’horloge, il reste juste même si l’écran se met en veille */
const T = {left:null, round:-1, running:false, end:0, iv:null, ctx:null};
function stopTimer(){ if (T.iv){ clearInterval(T.iv); T.iv = null; } T.running = false; }
function fmt(s){ s = Math.ceil(s); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); }
function beep(){
  try {
    const c = T.ctx; if (!c) return;
    [0, .3, .6].forEach((t, k) => {
      const o = c.createOscillator(), g = c.createGain(), at = c.currentTime + t;
      o.type = "sine"; o.frequency.value = k === 2 ? 1046 : 784;
      g.gain.setValueAtTime(.0001, at); g.gain.exponentialRampToValueAtTime(.35, at + .02); g.gain.exponentialRampToValueAtTime(.0001, at + .24);
      o.connect(g); g.connect(c.destination); o.start(at); o.stop(at + .26);
    });
  } catch(e){}
}
function paintClock(){
  const el = document.getElementById("clock"); if (!el || !S.cur || S.cur.round >= ROUNDS.length) return;
  const total = ROUNDS[S.cur.round].s, bar = document.getElementById("clockbar"), btn = document.getElementById("clockbtn");
  el.textContent = fmt(T.left);
  el.classList.toggle("over", T.left <= 0);
  if (bar) bar.style.width = (T.left / total * 100) + "%";
  if (btn) btn.textContent = T.running ? "Pause" : T.left <= 0 ? "Relancer" : T.left < total ? "Reprendre" : "Lancer le chrono";
}
function tick(){
  T.left = Math.max(0, (T.end - Date.now()) / 1000);
  if (T.left <= 0){ stopTimer(); beep(); }
  paintClock();
}
function toggleTimer(){
  if (!T.ctx){ try { const A = window.AudioContext || window.webkitAudioContext; if (A) T.ctx = new A(); } catch(e){} }
  try { if (T.ctx && T.ctx.state === "suspended") T.ctx.resume(); } catch(e){}
  if (T.running){ T.left = Math.max(0, (T.end - Date.now()) / 1000); stopTimer(); paintClock(); return; }
  if (T.left <= 0) T.left = ROUNDS[S.cur.round].s;
  T.running = true; T.end = Date.now() + T.left * 1000; T.iv = setInterval(tick, 200); paintClock();
}

function currentItem(){

  const pool = DATA[S.cur.game];

function draw(game){
  const pool = DATA[game], keyf = KEY[game];
  let seen = (S.seen[game] || []).filter(k => pool.some(i => keyf(i) === k));
  let unseen = pool.filter(i => !seen.includes(keyf(i)));
  if (!unseen.length){ seen = []; unseen = pool.slice(); toast("Toutes les cartes y sont passées : on remélange."); }
  const first = game === "prix" ? unseen.filter(i => i.s) : [];
  if (first.length) unseen = first;
  const item = unseen[Math.floor(Math.random() * unseen.length)];
  seen.push(keyf(item)); S.seen[game] = seen;
  S.cur = {game, key:keyf(item), picks:{}, revealed:false, awarded:{}};
  if (game === "mensonge") S.cur.order = shuffle([0, 1, 2]);
  if (game === "plaques") S.cur.reg = randomReg();
  if (game === "debat"){ S.cur.teams = makeTeams(); S.cur.round = 0; S.cur.jok = {x:0, y:0}; }
  stopTimer(); T.left = null;
}
function leader(){
  const max = Math.max(...S.players.map(p => p.score));
  if (max <= 0) return "Personne n’a encore marqué. Tout reste à jouer.";
  const top = S.players.filter(p => p.score === max).map(p => p.name);
  return top.length === 1 ? `En tête : <b>${ty(top[0])}</b> avec ${max} point${max>1?"s":""}.` : `Égalité en tête : <b>${ty(top.join(", "))}</b> avec ${max} points.`;
}
