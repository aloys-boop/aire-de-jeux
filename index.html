        <div class="band">${EU_STARS}<span>F</span></div>
        <div class="reg">${reg}</div>
        <div class="band"><span class="logo"></span><span class="dep">${it.c}</span></div>
      </div></div></div>`;
  }
  if (g.id === "debat"){
    const t = S.cur.teams;
    const mem = ids => ids.map(id => { const k = pIndex(id); return k < 0 ? "" : `<span class="member" style="--cap:${capOf(k)[0]}"><i></i>${esc(S.players[k].name)}</span>`; }).join("");
    const judge = t.j.length ? `<p class="judge">${ty("Arbitre : " + t.j.map(id => S.players[pIndex(id)].name).join(", "))}</p>` : "";
    return `<div class="sign ${sg}"><div class="in">
      ${it.p ? `<span class="spicy">Pimenté</span>` : `<p class="eyebrow">Le sujet</p>`}
      <h2 class="q">${ty(it.q)}</h2>
      <div class="camps">
        <div class="opt"><span class="tag">A</span><span>${ty(it.x)}</span></div>
        <div class="members">${mem(t.x)}</div>
        <div class="or">contre</div>
        <div class="opt"><span class="tag">B</span><span>${ty(it.y)}</span></div>
        <div class="members">${mem(t.y)}</div>
      </div>${judge}</div></div>`;
  }
  if (g.id === "mensonge"){
    const st = S.cur.order.map(k => k === 2 ? it.f : it.t[k]);
    return `<div class="sign ${sg} ${rev ? "revealed" : ""}"><div class="in">
      <p class="eyebrow">${ty("Deux vérités, un mensonge. Lequel ?")}</p>
      ${st.map((s, i) => `<div class="opt small ${rev && i === ans ? "chosen" : ""}"><span class="tag">${i + 1}</span><span>${ty(s)}</span></div>`).join("")}
    </div></div>`;
  }
  if (g.id === "quinous") return `<div class="sign ${sg}"><div class="in">
      ${it.p ? `<span class="spicy">Pimenté</span>` : `<p class="eyebrow">${ty("À trois, pointez du doigt")}</p>`}
      <h2 class="q">${ty(it.q)}</h2></div></div>`;
  if (g.id === "souvenir") return `<div class="sign ${sg}"><div class="in">
      <p class="eyebrow">${ty("On s’en souviendra encore dans…")}</p>
      <h2 class="big">${ty(it.n)}</h2><p class="sub">${ty(it.d)}</p></div></div>`;
  if (g.id === "tp" || g.id === "google"){
    const head = g.id === "tp" ? `<p class="eyebrow">Tu préfères…</p>`
      : `<p class="eyebrow">${ty(`Google ${it.s ? "Monde" : "France"} · ${it.y} · ${it.c}`)}</p><p class="sub">${ty("Laquelle a le plus grimpé dans les recherches ?")}</p>`;
    return `<div class="sign ${sg} ${rev ? "revealed" : ""}"><div class="in">${head}
      <div class="opt ${rev && ans===0 ? "chosen" : ""}"><span class="tag">A</span><span>${ty(it.a)}</span></div>
      <div class="or">ou</div>
      <div class="opt ${rev && ans===1 ? "chosen" : ""}"><span class="tag">B</span><span>${ty(it.b)}</span></div></div></div>`;
  }
  if (g.id === "prix") return `<div class="sign ${sg}"><div class="in"><p class="eyebrow">Devine le prix</p><h2 class="q">${ty(it.q)}</h2></div></div>`;
  if (g.id === "avap") return `<div class="sign ${sg}"><div class="in">
      <p class="eyebrow">${ty("Le 1 s’est-il passé avant ou après le 2 ?")}</p>
      <div class="opt"><span class="tag">1</span><span>${ty(it.a)}</span></div>
      <div class="or">avant ou après</div>
      <div class="opt"><span class="tag">2</span><span>${ty(it.b)}</span></div></div></div>`;
  if (g.id === "cote") return `<div class="sign ${sg}"><div class="in"><p class="eyebrow">Quelle est ma cote ?</p><h2 class="q">${ty(it.q)}</h2></div></div>`;
}

function picksHTML(g, ans){
  const c = S.cur, rev = c.revealed;
  if (g.closest){
    if (!rev) return `<p class="hint">${ty(g.id === "plaques" ? "Le premier qui crie le bon département marque. Bonus pour la préfecture." : "Chacun annonce sa réponse à voix haute, puis on révèle.")}</p>`;
    const groups = g.id === "plaques" ? [["d", "Qui a trouvé le département ?"], ["p", "Et la préfecture ?"]] : [["w", "Qui était le plus proche ?"]];
    const W = c.wins || {};
    return `<section class="picks">${groups.map(([k, t]) => `<div class="win-group"><h3 class="picks-h">${ty(t)}</h3>
      <div class="winners">${S.players.map((p, i) => { const on = !!W[k + ":" + p.id];
        return `<button class="chip" style="--cap:${capOf(i)[0]}" data-act="win" data-k="${k}" data-p="${p.id}" aria-pressed="${on}"><i></i>${esc(p.name)}${on ? " +1" : ""}</button>`; }).join("")}</div></div>`).join("")}
      <p class="hint">${ty("Tape sur le ou les gagnants : 1 point chacun. Tape à nouveau pour annuler.")}</p>
    </section>`;
  }
  if (g.vote){
    const judges = g.id === "debat" ? c.teams.j : [], top = rev ? topIds() : [];
    const title = rev ? "Les votes" : g.id === "debat" ? "Qui a été le meilleur orateur ?" : "Qui a pointé qui ?";
    const hint = g.id === "debat" ? "Chacun vote pour quelqu’un d’autre que lui. Chaque voix reçue rapporte 1 point." : "Note vers qui chacun a pointé le doigt, lui-même compris.";
    return `<section class="picks"><h3 class="picks-h">${title}</h3>${rev ? "" : `<p class="hint">${ty(hint)}</p>`}
      ${S.players.map((p, i) => { const pk = c.picks[p.id], aw = c.awarded[p.id];
        return `<div class="pick wide" style="--cap:${capOf(i)[0]}">
          <div class="pname"><i></i><span>${esc(p.name)} ${g.id === "debat" ? "vote pour…" : "pointe…"}</span>${rev && aw ? `<b class="award">+${aw}</b>` : ""}<b class="sc">${p.score} pt${p.score>1?"s":""}</b></div>
          <div class="chips" style="--n:${Math.min(S.players.length, 4)}">${S.players.map(q => {
            const off = g.id === "debat" && (q.id === p.id || judges.includes(q.id));
            const cls = "chip" + (rev && top.includes(q.id) ? " good" : "");
            return `<button class="${cls}" data-act="pick" data-p="${p.id}" data-v="${q.id}" aria-pressed="${pk === q.id}" ${rev || off ? "disabled" : ""}>${esc(q.name)}</button>`; }).join("")}</div>
        </div>`; }).join("")}
    </section>`;
  }
  const wide = g.opts.length > 2;
  return `<section class="picks"><h3 class="picks-h">${rev ? "Les réponses" : "Qui dit quoi ?"}</h3>
    ${S.players.map((p, i) => { const pk = c.picks[p.id]; const aw = c.awarded[p.id];
      return `<div class="pick ${wide ? "wide" : ""}" style="--cap:${capOf(i)[0]}">
        <div class="pname"><i></i><span>${esc(p.name)}</span>${rev && aw ? `<b class="award">+${aw}</b>` : ""}<b class="sc">${p.score} pt${p.score>1?"s":""}</b></div>
        <div class="chips" style="--n:${g.opts.length}">${g.opts.map((o, v) => {
          let cls = "chip"; if (rev && v === ans) cls += " good"; else if (rev && g.id==="souvenir" && Math.abs(v-ans)===1) cls += " near";
          return `<button class="${cls}" data-act="pick" data-p="${p.id}" data-v="${v}" aria-pressed="${pk===v}" ${rev ? "disabled" : ""}>${ty(o)}</button>`; }).join("")}</div>
      </div>`; }).join("")}
  </section>`;
}

function pointsLine(){
  const a = S.cur.awarded, ids = Object.keys(a).filter(k => a[k] > 0 && pIndex(k) > -1);
  if (!ids.length) return `<p class="pts-line none">Personne ne marque sur cette carte.</p>`;
  return `<p class="pts-line">${ty(ids.map(k => `+${a[k]} ${S.players[pIndex(k)].name}`).join(", "))}</p>`;
}

function topIds(){
  const n = tallyVotes(), m = Math.max(0, ...Object.values(n));
  return m > 0 ? Object.keys(n).filter(k => n[k] === m) : [];
}
function tallyHTML(n, top){
  const m = Math.max(1, ...Object.values(n));
  return `<div class="tally">${S.players.map((p, i) => `<div class="tl-row ${top.includes(p.id) ? "top" : ""}" style="--cap:${capOf(i)[0]}">
    <span><i></i>${esc(p.name)}</span><span class="tl-bar"><b style="width:${n[p.id] / m * 100}%"></b></span><em>${n[p.id]}</em></div>`).join("")}</div>`;
}
function debatePanels(it){
  const c = S.cur, r = c.round;
  if (c.revealed) return "";
  const camps = {x: it.x, y: it.y};
  const names = side => c.teams[side].map(id => S.players[pIndex(id)].name).join(" et ");
  let clock;
  if (r < ROUNDS.length){
    const R = ROUNDS[r];
    if (T.round !== r || T.left == null){ stopTimer(); T.round = r; T.left = R.s; }
    clock = `<div class="clock-row">
        <div class="clock-who">${ty(R.l + ", camp " + (R.c === "x" ? "A" : "B"))}<small>${ty(names(R.c) + (c.teams[R.c].length > 1 ? " défendent : " : " défend : ") + camps[R.c])}</small></div>
        <div class="clock" id="clock">${fmt(T.left)}</div></div>
      <div class="clock-bar"><span id="clockbar" style="width:${T.left / R.s * 100}%"></span></div>
      <div class="row-btns"><button class="btn primary" id="clockbtn" data-act="timer">Lancer le chrono</button>
        <button class="btn line" data-act="round">${r < ROUNDS.length - 1 ? "Tour suivant" : "Fin du débat"}</button></div>`;
  } else {
    clock = `<p class="why">${ty("Débat terminé. Place au vote : qui a été le meilleur orateur ?")}</p>
      <button class="btn-s" data-act="round-reset">Recommencer les tours</button>`;
  }
  const steps = ROUNDS.map((R, i) => `<div class="rd ${i === r ? "on" : i < r ? "done" : ""}"><b>${ty(R.l)}</b>Camp ${R.c === "x" ? "A" : "B"}, ${R.s} s</div>`).join("");
  const jk = side => {
    const arr = side === "x" ? it.ax : it.ay, n = c.jok[side];
    return `<div class="joker"><h4>${ty("Camp " + (side === "x" ? "A" : "B") + " : " + camps[side])}</h4>
      ${n ? `<ul>${arr.slice(0, n).map(a => `<li>${ty(a)}</li>`).join("")}</ul>` : ""}
      ${n < arr.length ? `<button class="btn-s" data-act="joker" data-side="${side}">${n ? "Encore un argument" : "Souffle-moi un argument"} (${arr.length - n})</button>` : `<p class="hint">${ty("Plus d’argument de secours pour ce camp.")}</p>`}</div>`;
  };
  return `<button class="link" data-act="teams">Retirer les camps au sort</button>
    <section class="panel"><h3>Le chrono</h3><div class="rounds">${steps}</div>${clock}</section>
    <section class="panel"><h3>Arguments de secours</h3><p class="hint">${ty("En cas de panne seulement. L’autre camp a le droit de se moquer.")}</p>
      <div class="jokers">${jk("x")}${jk("y")}</div></section>`;
}

function lookupHTML(){
  return `<section class="panel lookup"><h3>Une vraie plaque vient de passer ?</h3>
    <label class="hint" for="lk">${ty("Tape le numéro affiché à droite de la plaque.")}</label>
    <input id="lk" inputmode="text" autocomplete="off" autocapitalize="characters" maxlength="3" placeholder="Ex. 63">
    <output id="lk-out" for="lk"></output></section>`;
}
function renderBingo(g){
  const B = ensureBingo(), sel = S.bsel, f = Object.keys(B.found).length;
  const cells = B.cells.map((t, i) => {
    const pid = B.found[i], k = pid ? pIndex(pid) : -1;
    const st = k >= 0 ? ` style="--cap:${capOf(k)[0]};--capfg:${capOf(k)[1]}"` : "";
    return `<button class="bcell ${k >= 0 ? "found" : ""} ${sel === i ? "sel" : ""}"${st} data-act="bcell" data-i="${i}" aria-pressed="${k >= 0}">${ty(t)}${k >= 0 ? `<span class="who">${esc(S.players[k].name)}</span>` : ""}</button>`;
  }).join("");
  let panel = "";
  if (sel != null && B.cells[sel]){
    const pid = B.found[sel], k = pid ? pIndex(pid) : -1;
    panel = k >= 0
      ? `<div class="bpanel" id="bpanel"><p>${ty("« " + B.cells[sel] + " » : repéré par " + S.players[k].name + ".")}</p>
          <div class="ed-actions"><button class="btn-s warn" data-act="bunspot">Retirer</button><button class="btn-s" data-act="bclose">Fermer</button></div></div>`
      : `<div class="bpanel" id="bpanel"><p>${ty("Qui a repéré « " + B.cells[sel] + " » ?")}</p>
          <div class="winners">${S.players.map((p, i) => `<button class="chip" style="--cap:${capOf(i)[0]}" data-act="bspot" data-p="${p.id}"><i></i>${esc(p.name)}</button>`).join("")}</div>
          <button class="link" data-act="bclose">Annuler</button></div>`;
  }
  const stats = S.players.map(p => {
    const c = Object.values(B.found).filter(x => x === p.id).length, l = Object.values(B.lines).filter(x => x === p.id).length;
    return `<span><b>${esc(p.name)}</b> ${c} repéré${c > 1 ? "s" : ""}${l ? `, ${l} ligne${l > 1 ? "s" : ""}` : ""}</span>`; }).join("");
  const renew = S.bconfirm
    ? `<div class="ed-actions"><button class="btn-s warn" data-act="bnew-yes">Oui, nouvelle grille</button><button class="btn-s" data-act="bnew-no">Annuler</button></div>`
    : `<button class="link" data-act="bnew">Tirer une nouvelle grille</button>`;
  document.getElementById("app").innerHTML = `
  <div class="topbar"><div class="topbar-in">
    <button class="back" data-act="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>Aire</button>
    <span class="tb-title">${ty(g.name)}</span>
    <span class="tb-count">${f}/16</span>
  </div></div>
  <main class="wrap">
    <details class="rule" ${S.ruleOpen && S.ruleOpen[g.id] ? "open" : ""} data-rule="${g.id}"><summary>Règle du jeu</summary><p>${ty(g.rule)}</p></details>
    <div class="sign ${g.sign}"><div class="in">
      <p class="eyebrow">${ty("Toulouse → Clermont-Ferrand")}</p>
      <h2 class="q">${ty(f === 16 ? "Carton plein !" : f + " sur 16 repérés")}</h2>
      <p class="sub">${ty("Tape une case quand quelqu’un la repère. Ligne, colonne ou diagonale : +3. Carton plein : +5.")}</p>
    </div></div>
    <div class="bgrid" lang="fr">${cells}</div>
    ${panel}
    <div class="bstats">${stats}</div>
    ${renew}
  </main>`;
}

function revealHTML(g, it, ans){
  if (g.id === "plaques"){
    const onRoute = ROUTE.deps.includes(it.c);
    return `<section class="reveal" id="rev"><p class="eyebrow">${ty("Le " + it.c + ", c’est…")}</p>
      <p class="verdict">${ty(it.n)}</p>
      <p class="why">${ty("Préfecture : " + it.p + ".")}</p>
      ${onRoute ? `<span class="route">${ty("Sur votre route (" + ROUTE.label + ")")}</span>` : ""}
      ${pointsLine()}</section>`;
  }
  if (g.id === "debat"){
    const n = tallyVotes(), top = topIds();
    return `<section class="reveal" id="rev"><p class="eyebrow">${top.length > 1 ? "Meilleurs orateurs" : "Meilleur orateur"}</p>
      <p class="verdict">${top.length ? ty(top.map(id => S.players[pIndex(id)].name).join(" et ")) : "Aucun vote"}</p>
      ${tallyHTML(n, top)}${pointsLine()}
      <p class="eyebrow">Mon avis sur le fond</p><p class="why">${ty(it.m)}</p></section>`;
  }
  if (g.id === "quinous"){
    const n = tallyVotes(), top = topIds(), who = top.map(id => S.players[pIndex(id)].name);
    const msg = !who.length ? "Aucun vote noté. Pointez du doigt au signal, puis notez les votes."
      : who.length > 1 ? "Égalité : chacun a 30 secondes pour se défendre."
      : who[0] + " a 30 secondes pour se défendre. Le reste de la voiture peut contre-attaquer.";
    return `<section class="reveal" id="rev"><p class="eyebrow">${who.length > 1 ? "Les élus" : "L’élu"}</p>
      <p class="verdict">${who.length ? ty(who.join(" et ")) : "Personne"}</p>
      ${tallyHTML(n, top)}<p class="why">${ty(msg)}</p>${pointsLine()}</section>`;
  }
  if (g.id === "mensonge"){
    const st = S.cur.order.map(k => ({s: k === 2 ? it.f : it.t[k], lie: k === 2}));
    return `<section class="reveal" id="rev"><p class="eyebrow">Le mensonge</p>
      <p class="verdict">${ty("C’est le n° " + (ans + 1))}</p>
      <div class="stmts">${st.map(x => `<div class="stmt ${x.lie ? "lie" : ""}"><em>${x.lie ? "Faux" : "Vrai"}</em><span>${ty(x.s)}</span></div>`).join("")}</div>
      <p class="why">${ty(it.w)}</p>${pointsLine()}</section>`;
  }
  if (g.id === "souvenir"){
    const pos = (ans + .5) / 5 * 100;
    return `<section class="reveal" id="rev"><p class="eyebrow">Mon verdict</p>
      <p class="verdict">${ty(HORIZ[ans])}</p>
      <div class="road" aria-label="${esc(HYEAR[ans])}">
        <div class="asphalt"><div class="fill" style="width:${pos}%"></div><div class="dash"></div><span class="car" style="left:${pos}%">${CAR}</span></div>
        <div class="marks">${["< 100","100","300","500","1 000+"].map((m, i) => `<span class="${i===ans?"on":""}">${ty(m)}<small>${["avant 2126","2126","2326","2526","3026"][i]}</small></span>`).join("")}</div>
      </div>
      <p class="why">${ty(it.w)}</p>${pointsLine()}</section>`;
  }
  if (g.id === "tp"){
    const t = S.players.reduce((acc, p) => { const v = S.cur.picks[p.id]; if (v===0) acc[0]++; if (v===1) acc[1]++; return acc; }, [0,0]);
    const tally = t[0] + t[1] ? `Dans la voiture : ${t[0]} pour A, ${t[1]} pour B.` : "";
    return `<section class="reveal" id="rev"><p class="eyebrow">Mon choix</p>
      <p class="verdict">${ans===0 ? "A" : "B"}</p><p class="why">${ty(it.w)}</p>
      ${tally ? `<p class="hint">${ty(tally)}</p>` : ""}${pointsLine()}</section>`;
  }
  if (g.id === "prix") return `<section class="reveal" id="rev"><p class="eyebrow">La réponse</p>
      <p class="verdict">${ty(it.r)}</p><p class="why">${ty(it.x)}</p>
      ${it.s ? `<p class="src">Source : ${it.u ? `<a href="${esc(it.u)}" target="_blank" rel="noopener">${ty(it.s)}</a>` : ty(it.s)}</p>` : ""}</section>`;
  if (g.id === "google"){
    const rows = [[it.a, it.ra, ans===0], [it.b, it.rb, ans===1]].sort((x, y) => x[1] - y[1]);
    return `<section class="reveal" id="rev"><p class="eyebrow">${ty(`Classement Google ${it.s ? "Monde" : "France"} ${it.y} · ${it.c}`)}</p>
      <div class="ranks">${rows.map(r => `<div class="rank ${r[2] ? "win" : ""}"><em>${r[1]}<sup>${r[1]===1?"er":"e"}</sup></em><b>${ty(r[0])}</b></div>`).join("")}</div>
      ${it.x ? `<p class="why">${ty(it.x)}</p>` : ""}
      <p class="hint">${ty("Google classe les recherches qui ont le plus progressé sur l’année, pas forcément les plus nombreuses.")}</p>${pointsLine()}</section>`;
  }
  if (g.id === "avap"){
    const rows = [[it.a, it.la, it.ya, true], [it.b, it.lb, it.yb, false]].sort((x, y) => x[2] - y[2]);
    return `<section class="reveal" id="rev"><p class="eyebrow">La réponse</p>
      <p class="verdict">${ans===0 ? "Avant" : "Après"}</p>
      <div class="tl">${rows.map(r => `<div class="${r[3] ? "a" : ""}"><b>${ty(r[0])}</b><span>${ty(r[1])}</span></div>`).join("")}</div>
      <p class="why">${ty(it.w)}</p>${pointsLine()}</section>`;
  }
  if (g.id === "cote") return `<section class="reveal" id="rev"><p class="eyebrow">Ma cote</p>
      <p class="verdict">${it.p} %</p>
      <div><div class="gauge"><span style="width:${it.p}%"></span></div><div class="gauge-ticks"><span>0</span><span>25</span><span>50</span><span>75</span><span>100</span></div></div>
      <p class="why">${ty(it.w)}</p></section>`;
}

function renderGame(){
  const g = GM[S.cur.game];
  if (g.special) return renderBingo(g);
  const it = currentItem();
  if (!it){ draw(g.id); return renderGame(); }
  if (g.id === "debat"){
    if (!teamsValid(S.cur.teams)){ S.cur.teams = makeTeams(); S.cur.picks = {}; }
    if (S.cur.round == null) S.cur.round = 0;
    if (!S.cur.jok) S.cur.jok = {x:0, y:0};
  }
  if (g.id === "mensonge" && !Array.isArray(S.cur.order)) S.cur.order = shuffle([0, 1, 2]);
  const rev = S.cur.revealed, ans = answer(g.id, it);
  const deb = g.id === "debat";
  const n = DATA[g.id].length, seen = (S.seen[g.id] || []).length;
  document.getElementById("app").innerHTML = `
  <div class="topbar"><div class="topbar-in">
    <button class="back" data-act="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>Aire</button>
    <span class="tb-title">${ty(g.name)}</span>
    <span class="tb-count">${seen}/${n}</span>
  </div></div>
  <main class="wrap">
    <details class="rule" ${S.ruleOpen && S.ruleOpen[g.id] ? "open" : ""} data-rule="${g.id}"><summary>Règle du jeu</summary><p>${ty(g.rule)}</p></details>
    ${promptHTML(g, it, rev, ans)}
    ${deb ? debatePanels(it) : ""}
    ${picksHTML(g, ans)}
    ${rev ? revealHTML(g, it, ans) : `<button class="btn primary" data-act="reveal">${deb ? "Révéler les votes et mon avis" : "Révéler"}</button>`}
    <div class="nav">${rev ? `<button class="btn primary" data-act="next">${deb ? "Sujet suivant" : "Carte suivante"}</button>` : `<button class="btn ghost" data-act="next">${deb ? "Changer de sujet" : "Passer cette carte"}</button>`}</div>
    ${g.id === "plaques" ? lookupHTML() : ""}
  </main>`;
}

function render(){
  if (S.view === "game" && S.cur) renderGame(); else { S.view = "home"; stopTimer(); renderHome(); }
  paintClock();
  save();
}

/* ============ ACTIONS ============ */
const app = document.getElementById("app");
app.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  keepAwake();
  const act = b.dataset.act, pid = b.dataset.p;
  switch (act){
    case "open": {
      const gid = b.dataset.game;
      if (GM[gid].special){ stopTimer(); S.cur = {game: gid}; S.bsel = null; S.bconfirm = false; }
      else if (!S.cur || S.cur.game !== gid) draw(gid);
      S.view = "game"; render(); window.scrollTo(0, 0); return;
    }
    case "home": S.view = "home"; render(); window.scrollTo(0, 0); return;
    case "edit": S.editing = !S.editing; S.confirmReset = false; render(); return;
    case "add": {
      const id = "p" + Date.now().toString(36);
      S.players.push({id, name:"Pote " + (S.players.length + 1), score:0}); render();
      const inp = document.getElementById("pn-" + id); if (inp){ inp.focus(); inp.select(); } return;
    }
    case "del": if (S.players.length > 1){ S.players = S.players.filter(p => p.id !== pid); render(); } return;
    case "reset": S.confirmReset = true; render(); return;
    case "reset-no": S.confirmReset = false; render(); return;
    case "reset-yes": S.players.forEach(p => p.score = 0); S.confirmReset = false; render(); toast("Scores remis à zéro."); return;
    case "timer": toggleTimer(); return;
    case "round": stopTimer(); S.cur.round = Math.min(ROUNDS.length, (S.cur.round || 0) + 1); T.left = null; render(); return;
    case "round-reset": stopTimer(); S.cur.round = 0; T.left = null; render(); return;
    case "joker": { const s = b.dataset.side; S.cur.jok[s] = (S.cur.jok[s] || 0) + 1; render(); return; }
    case "teams": S.cur.teams = makeTeams(); S.cur.picks = {}; render(); toast("Nouveaux camps tirés au sort."); return;
    case "pick": {
      if (S.cur.revealed) return;
      const v = GM[S.cur.game].vote ? b.dataset.v : +b.dataset.v;
      S.cur.picks[pid] = S.cur.picks[pid] === v ? undefined : v;
      if (S.cur.picks[pid] === undefined) delete S.cur.picks[pid];
      render(); return;
    }
    case "reveal": {
      const g = GM[S.cur.game], it = currentItem(), ans = answer(g.id, it);
      if (g.id === "debat"){
        stopTimer(); const n = tallyVotes();
        S.players.forEach(p => { if (n[p.id]){ S.cur.awarded[p.id] = n[p.id]; p.score += n[p.id]; } });
      } else if (g.id === "quinous"){
        const top = topIds();
        S.players.forEach(p => { if (top.includes(S.cur.picks[p.id])){ S.cur.awarded[p.id] = 1; p.score += 1; } });
      } else if (!g.closest){
        S.players.forEach(p => { const pts = pointsFor(g.id, S.cur.picks[p.id], ans); if (pts){ S.cur.awarded[p.id] = pts; p.score += pts; } });
      }
      S.cur.revealed = true; render();
      const r = document.getElementById("rev"); if (r) r.scrollIntoView({behavior: reduceMotion() ? "auto" : "smooth", block:"start"});
      return;
    }
    case "win": {
      const p = S.players[pIndex(pid)]; if (!p) return;
      const k = (b.dataset.k || "w") + ":" + pid; S.cur.wins = S.cur.wins || {};
      if (S.cur.wins[k]){
        delete S.cur.wins[k]; p.score -= 1;
        S.cur.awarded[pid] = (S.cur.awarded[pid] || 1) - 1; if (!S.cur.awarded[pid]) delete S.cur.awarded[pid];
      } else { S.cur.wins[k] = 1; p.score += 1; S.cur.awarded[pid] = (S.cur.awarded[pid] || 0) + 1; }
      render(); return;
    }
    case "bcell": {
      const i = +b.dataset.i; S.bsel = S.bsel === i ? null : i; render();
      const pn = document.getElementById("bpanel");
      if (pn) pn.scrollIntoView({behavior: reduceMotion() ? "auto" : "smooth", block:"nearest"});
      return;
    }
    case "bspot": if (S.bsel != null){ spot(S.bsel, pid); S.bsel = null; render(); } return;
    case "bunspot": if (S.bsel != null){ unspot(S.bsel); S.bsel = null; render(); } return;
    case "bclose": S.bsel = null; render(); return;
    case "bnew": S.bconfirm = true; render(); return;
    case "bnew-no": S.bconfirm = false; render(); return;
    case "bnew-yes": S.bingo = null; ensureBingo(); S.bconfirm = false; S.bsel = null; render(); toast("Nouvelle grille tirée. Les points déjà gagnés restent."); return;
    case "next": draw(S.cur.game); render(); window.scrollTo(0, 0); return;
  }
});
app.addEventListener("input", e => {
  if (e.target.id === "lk"){
    const out = document.getElementById("lk-out"), v = e.target.value.trim(), d = findDept(v);
    out.innerHTML = !v ? "" : d
      ? `${ty(d.n)} <span>${ty("· préfecture : " + d.p + (ROUTE.deps.includes(d.c) ? " · sur votre route" : ""))}</span>`
      : `<span>${ty("Aucun département ne porte ce numéro.")}</span>`;
    return;
  }
  const pid = e.target.dataset && e.target.dataset.pid; if (!pid) return;
  const p = S.players[pIndex(pid)]; if (p){ p.name = e.target.value.trim() || "Passager"; save(); }
});
app.addEventListener("toggle", e => {
  const d = e.target; if (!d.dataset || !d.dataset.rule) return;
  S.ruleOpen = S.ruleOpen || {}; S.ruleOpen[d.dataset.rule] = d.open; save();
}, true);

render();
</script>

if ("serviceWorker" in navigator) {
  addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
